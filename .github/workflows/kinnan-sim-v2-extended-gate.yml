name: Kinnan sim v2 extended equivalence gate

on:
  workflow_dispatch:
  push:
    branches: [agent/sim-v2-overopt]
    paths:
      - '.github/workflows/kinnan-sim-v2-extended-gate.yml'

concurrency:
  group: kinnan-v2-extended-gate
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
  SIM_V2_TRACE: '0'
  SIM_V2_EARLY_SUCCESS: '1'
  SIM_V2_EXACT_DEADLINE: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - mode: screen
            pod: screen
            seat: 1
            seed0: 1730000
          - mode: screen
            pod: screen
            seat: 3
            seed0: 1730100
          - mode: adversarial
            pod: mixed
            seat: 2
            seed0: 1730200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-v2-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - name: Cold compatibility control
        env:
          CEDH_POD: ${{ matrix.pod }}
          SIM_V2_PROFILE: extended-control-v1
        run: |
          S0='${{ matrix.seed0 }}'; S1=$((S0+1))
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ \
            --mode '${{ matrix.mode }}' --variant P00_F10 --fixed-seat '${{ matrix.seat }}' \
            --seeds "$S0" "$S1" \
            --jvm-reuse 1 --xmx 1536m --xms 192m --max-round 4 --max-prompts 4000 --max-seconds 120 \
            --cache-dir .sim-cache/extended-control --engine-id "$MANABREW_REF:extended-control" \
            --retain-traces none --output out/control.json
      - name: Ultra persistent control
        env:
          CEDH_POD: ${{ matrix.pod }}
        run: |
          S0='${{ matrix.seed0 }}'; S1=$((S0+1))
          python3 engine-tests/sim_v2_parallel.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ \
            --mode '${{ matrix.mode }}' --variant P00_F10 --fixed-seat '${{ matrix.seat }}' \
            --seeds "$S0" "$S1" --workers 2 --jvm-reuse 2 --xmx 1280m --xms 192m \
            --max-round 4 --max-prompts 4000 --max-seconds 120 \
            --cache-dir .sim-cache/extended-ultra --engine-id "$MANABREW_REF:extended-ultra-v2" \
            --retain-traces none --output out/ultra.json | tee out/ultra.log
      - name: Compare primary endpoints
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('out/control.json')); b=json.load(open('out/ultra.json'))
          assert len(a)==len(b)==2,(len(a),len(b))
          fields=('seed','kinnanSeat','firstAssemblyTurn','firstAttemptTurn','strictProtectedT4')
          bad=[]
          for x,y in zip(a,b):
              d={k:(x.get(k),y.get(k)) for k in fields if x.get(k)!=y.get(k)}
              if d: bad.append({'seed':x.get('seed'),'diff':d})
          print(json.dumps({'mismatches':bad,'ultra':b},indent=2))
          if bad: raise SystemExit(f'{len(bad)} endpoint mismatches')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extended-gate-${{ matrix.mode }}-${{ matrix.pod }}-seat${{ matrix.seat }}
          path: out/
          retention-days: 14
