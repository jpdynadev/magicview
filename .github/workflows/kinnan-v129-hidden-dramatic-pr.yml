name: Kinnan v129 Hidden Dramatic PR Screen

on:
  pull_request:
    branches: [agent/kinnan-engine-tests]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-high-value-confirmation
  cancel-in-progress: false

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '0'
  SIM_V2_PROFILE: arch-repaired-v129-hidden-dramatic-200-pr-7000p-240s

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired v1.29 runtime and validate decks
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/generate_v129_hiddenstrings_dramatic.py
          for f in 112_payment_repair 113_payment_scope_fix 114_monolith_affordability_fix 115_monolith_payment_progress_fix 116_replicate_number_fix 117_fourarch_roles 118_kinnan_color_affordability_fix 119_kinnan_colored_payment_priority_fix 120_kinnan_colored_source_assignment_fix 121_kinnan_outer_affordability_fix 122_kinnan_conservative_color_reserve_fix 123_kinnan_failed_payment_step_guard 124_kinnan_payment_cancel_latch 125_kinnan_action_score_cancel_block 126_kinnan_combo_cancel_block; do python3 engine-tests/apply_arch_v${f}.py; done
          python3 engine-tests/apply_arch_v129_hidden_dramatic_roles.py
          python3 - <<'PY'
          from pathlib import Path
          for key in ('F10','F10_HIDDEN_DRAMATIC_PACKAGE'):
              p=Path('engine-tests/decks')/f'Kinnan_ARCH_{key}.dck'
              lines=p.read_text().splitlines(); start=lines.index('[Main]')+1
              cards=[x.split(' ',1)[1] for x in lines[start:] if x.strip()]
              assert len(cards)==99 and len(set(cards))==99,(key,len(cards),len(set(cards)))
          assert 'arch-aware-v1.29-hidden-dramatic-adversarial' in Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          PY
          rm -rf /tmp/manabrew && git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF" && git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE" && python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew && node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-v129-hidden-dramatic.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: v129-hidden-dramatic-runtime
          path: manabrew-v129-hidden-dramatic.tgz
          compression-level: 0
          retention-days: 2

  semantic-gate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [F10, F10_HIDDEN_DRAMATIC_PACKAGE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: v129-hidden-dramatic-runtime, path: runtime}
      - name: Production-profile semantic gate
        env: {VARIANT: '${{ matrix.variant }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew gate && tar -C /tmp/manabrew -xzf runtime/manabrew-v129-hidden-dramatic.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/generate_v129_hiddenstrings_dramatic.py
          for f in 112_payment_repair 113_payment_scope_fix 114_monolith_affordability_fix 115_monolith_payment_progress_fix 116_replicate_number_fix 117_fourarch_roles 118_kinnan_color_affordability_fix 119_kinnan_colored_payment_priority_fix 120_kinnan_colored_source_assignment_fix 121_kinnan_outer_affordability_fix 122_kinnan_conservative_color_reserve_fix 123_kinnan_failed_payment_step_guard 124_kinnan_payment_cancel_latch 125_kinnan_action_score_cancel_block 126_kinnan_combo_cancel_block; do python3 engine-tests/apply_arch_v${f}.py; done
          python3 engine-tests/apply_arch_v129_hidden_dramatic_roles.py
          if [ "$VARIANT" = F10 ]; then SEED=5999000; else SEED=5999001; fi
          CEDH_POD=balanced python3 engine-tests/sim_v2_worker_arch.py /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ --mode adversarial --variant "$VARIANT" --fixed-seat 0 --seeds "$SEED" --max-round 4 --max-prompts 7000 --max-seconds 240 --jvm-reuse 1 --xmx 1280m --xms 192m --cache-dir ".sim-cache/v129hdgate-${GITHUB_RUN_ID}-${VARIANT}" --retain-traces failures --engine-id "$MANABREW_REF:arch-v129-hidden-dramatic-gate:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:$SEED" --exposure-card 'Hidden Strings' --exposure-card 'Dramatic Reversal' --exposure-card 'Misdirection' --exposure-card 'Energy Refractor' --output "gate/${VARIANT}.json"
          python3 - "gate/${VARIANT}.json" "$VARIANT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) else d
          assert r.get('status') in {'game_over','horizon_complete'},r
          assert r.get('variant')==sys.argv[2]
          assert r.get('pilotVersion')=='arch-aware-v1.29-hidden-dramatic-adversarial'
          PY

  screen:
    needs: semantic-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [F10, F10_HIDDEN_DRAMATIC_PACKAGE]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: v129-hidden-dramatic-runtime, path: runtime}
      - name: Run 50 strict canonical paired keys
        env:
          VARIANT: ${{ matrix.variant }}
          SEAT: ${{ matrix.seat }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out/valid out/attempts && tar -C /tmp/manabrew -xzf runtime/manabrew-v129-hidden-dramatic.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/generate_v129_hiddenstrings_dramatic.py
          for f in 112_payment_repair 113_payment_scope_fix 114_monolith_affordability_fix 115_monolith_payment_progress_fix 116_replicate_number_fix 117_fourarch_roles 118_kinnan_color_affordability_fix 119_kinnan_colored_payment_priority_fix 120_kinnan_colored_source_assignment_fix 121_kinnan_outer_affordability_fix 122_kinnan_conservative_color_reserve_fix 123_kinnan_failed_payment_step_guard 124_kinnan_payment_cancel_latch 125_kinnan_action_score_cancel_block 126_kinnan_combo_cancel_block; do python3 engine-tests/apply_arch_v${f}.py; done
          python3 engine-tests/apply_arch_v129_hidden_dramatic_roles.py
          EXP_ARGS=(--exposure-card 'Misdirection' --exposure-card 'Energy Refractor' --exposure-card 'Hidden Strings' --exposure-card 'Dramatic Reversal')
          BASE=$((6000000 + SEAT * 10000)); : > "out/${VARIANT}-seat${SEAT}-errors.ndjson"
          for OFFSET in $(seq 0 49); do
            SEED=$((BASE + OFFSET)); case $((OFFSET % 4)) in 0) POD=balanced;; 1) POD=turbo;; 2) POD=midrange;; 3) POD=mixed;; esac
            OK=0
            for TRY in 1 2 3; do
              ATT="out/attempts/${VARIANT}-s${SEAT}-seed${SEED}-${POD}-try${TRY}.json"
              CACHE=".sim-cache/v129hd-${GITHUB_RUN_ID}-${VARIANT}-s${SEAT}-${SEED}-${POD}-try${TRY}"
              ENGINE="$MANABREW_REF:arch-v129-hidden-dramatic-200:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:s${SEAT}:${SEED}:${POD}:try${TRY}"
              set +e
              CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" --max-round 4 --max-prompts 7000 --max-seconds 240 --jvm-reuse 1 --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures --engine-id "$ENGINE" "${EXP_ARGS[@]}" --output "$ATT" > "out/attempts/${VARIANT}-s${SEAT}-seed${SEED}-${POD}-try${TRY}.log" 2>&1
              RC=$?; set -e
              STATUS=$(python3 - "$ATT" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) and d else d
              print(r.get('status','missing'))
          except Exception: print('missing')
          PY
              )
              if [ "$STATUS" = game_over ] || [ "$STATUS" = horizon_complete ]; then
                python3 - "$ATT" "$VARIANT" "$SEAT" "$SEED" "$POD" <<'PY'
          import json,sys
          p,v,seat,seed,pod=sys.argv[1:]; d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
          assert r.get('variant')==v and int(r.get('kinnanSeat'))==int(seat) and int(r.get('seed'))==int(seed) and r.get('podProfile')==pod
          assert r.get('pilotVersion')=='arch-aware-v1.29-hidden-dramatic-adversarial'
          PY
                cp "$ATT" "out/valid/${VARIANT}-s${SEAT}-seed${SEED}.json"; OK=1; break
              fi
              printf '{"variant":"%s","seat":%s,"seed":%s,"pod":"%s","try":%s,"status":"%s","rc":%s}\n' "$VARIANT" "$SEAT" "$SEED" "$POD" "$TRY" "$STATUS" "$RC" >> "out/${VARIANT}-seat${SEAT}-errors.ndjson"
            done
            [ "$OK" -eq 1 ] || echo "UNRESOLVED $VARIANT $SEAT $SEED $POD" >&2
          done
          python3 - "$VARIANT" "$SEAT" <<'PY'
          import glob,json,sys
          v=sys.argv[1]; seat=int(sys.argv[2]); lo=6000000+seat*10000; hi=lo+49; rows=[]
          for p in glob.glob(f'out/valid/{v}-s{seat}-seed*.json'):
              d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
              if lo<=int(r['seed'])<=hi: rows.append(r)
          keys={(int(r['seed']),int(r['kinnanSeat']),r.get('podProfile')) for r in rows if r.get('status') in {'game_over','horizon_complete'} and r.get('pilotVersion')=='arch-aware-v1.29-hidden-dramatic-adversarial'}
          assert len(rows)==50 and len(keys)==50,(v,seat,len(rows),len(keys))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v129hd-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/**
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: v129hd-*, path: all}
      - name: Strict paired aggregate
        run: |
          python3 - <<'PY'
          import collections,glob,json,math,pathlib
          variants=['F10','F10_HIDDEN_DRAMATIC_PACKAGE']; valid={'game_over','horizon_complete'}
          rows={v:[] for v in variants}; errors={v:[] for v in variants}
          for p in glob.glob('all/**/valid/*.json',recursive=True):
              d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
              if r.get('variant') in rows: rows[r['variant']].append(r)
          for p in glob.glob('all/**/*errors.ndjson',recursive=True):
              for line in open(p):
                  try:r=json.loads(line)
                  except Exception:continue
                  if r.get('variant') in errors: errors[r['variant']].append(r)
          def key(r): return (int(r['seed']),int(r['kinnanSeat']),str(r.get('podProfile')))
          def met(r,m):
              if m=='assemblyT4': return (r.get('firstAssemblyTurn') or 99)<=4
              if m=='attemptT4': return (r.get('firstAttemptTurn') or 99)<=4
              return bool(r.get(m))
          maps={v:{key(r):r for r in rows[v] if r.get('status') in valid and r.get('pilotVersion')=='arch-aware-v1.29-hidden-dramatic-adversarial'} for v in variants}
          base=maps['F10']; cand=maps['F10_HIDDEN_DRAMATIC_PACKAGE']
          rep={'strictValid':False,'profile':'arch-repaired-v129-hidden-dramatic-200-pr-7000p-240s','variants':{},'paired':{},'errorAttempts':{},'cacheReuse':{'compatiblePriorRowsReused':0},'exposure':{}}
          for v in variants:
              good=list(maps[v].values())
              st={'records':len(rows[v]),'valid':len(good),'uniqueKeys':len(maps[v]),'assemblyT4':sum(met(r,'assemblyT4') for r in good),'attemptT4':sum(met(r,'attemptT4') for r in good),'protectedT4':sum(met(r,'strictProtectedT4') for r in good),'wins':sum(met(r,'kinnanWon') for r in good),'mulligans':sum(int(r.get('mulligans') or 0) for r in good),'failureCodes':dict(collections.Counter(str(r.get('primaryFailureCode') or 'NONE') for r in good)),'pods':{},'seats':{}}
              for pod in ('balanced','turbo','midrange','mixed'):
                  x=[r for r in good if r.get('podProfile')==pod]
                  st['pods'][pod]={'n':len(x),'assemblyT4':sum(met(r,'assemblyT4') for r in x),'attemptT4':sum(met(r,'attemptT4') for r in x),'protectedT4':sum(met(r,'strictProtectedT4') for r in x),'wins':sum(met(r,'kinnanWon') for r in x)}
              for s in range(4):
                  x=[r for r in good if int(r.get('kinnanSeat',-1))==s]
                  st['seats'][str(s)]={'n':len(x),'assemblyT4':sum(met(r,'assemblyT4') for r in x),'attemptT4':sum(met(r,'attemptT4') for r in x),'protectedT4':sum(met(r,'strictProtectedT4') for r in x),'wins':sum(met(r,'kinnanWon') for r in x)}
              rep['variants'][v]=st
              rep['errorAttempts'][v]=dict(collections.Counter(str(e.get('status') or 'missing') for e in errors[v]))
          common=sorted(set(base)&set(cand))
          for m in ('assemblyT4','attemptT4','strictProtectedT4','kinnanWon'):
              cv=sum(met(cand[k],m) for k in common); bv=sum(met(base[k],m) for k in common)
              a=sum(met(cand[k],m) and not met(base[k],m) for k in common); c=sum(met(base[k],m) and not met(cand[k],m) for k in common); n=a+c
              p=1.0 if not n else min(1.0,2*sum(math.comb(n,i) for i in range(min(a,c)+1))/(2**n))
              rep['paired'][m]={'keys':len(common),'candidate':cv,'baseline':bv,'deltaRate':(cv-bv)/len(common) if common else None,'candidateOnly':a,'baselineOnly':c,'pTwoSided':p}
          changed=['Misdirection','Energy Refractor','Hidden Strings','Dramatic Reversal']; exposed=[]
          for k in common:
              b=set(base[k].get('observedCards') or []); c=set(cand[k].get('observedCards') or [])
              if b.intersection(changed) or c.intersection(changed): exposed.append(k)
          rep['exposure']={'pairedKeys':len(common),'exposedKeys':len(exposed),'baselineProtected':sum(met(base[k],'strictProtectedT4') for k in exposed),'candidateProtected':sum(met(cand[k],'strictProtectedT4') for k in exposed),'baselineAttempts':sum(met(base[k],'attemptT4') for k in exposed),'candidateAttempts':sum(met(cand[k],'attemptT4') for k in exposed)}
          rep['strictValid']=(all(rep['variants'][v]['records']==200 and rep['variants'][v]['valid']==200 and rep['variants'][v]['uniqueKeys']==200 for v in variants) and set(base)==set(cand))
          out=pathlib.Path('engine-tests/results/kinnan-v129-hidden-dramatic-200-latest.json'); out.parent.mkdir(exist_ok=True); out.write_text(json.dumps(rep,indent=2,sort_keys=True)); print(json.dumps(rep,indent=2,sort_keys=True))
          if not rep['strictValid']: raise SystemExit('STRICT_V129_HIDDEN_DRAMATIC_200_FAILED')
          PY
      - name: Commit strict report
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add engine-tests/results/kinnan-v129-hidden-dramatic-200-latest.json
          git diff --cached --quiet || git commit -m 'Record v129 Hidden Dramatic 200 result [skip ci]'
          git push origin HEAD:agent/kinnan-expanded-architecture
