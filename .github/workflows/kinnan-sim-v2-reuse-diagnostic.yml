name: Kinnan sim v2 reuse diagnostic

on:
  workflow_dispatch:
  push:
    branches: [agent/sim-v2-overopt]
    paths:
      - '.github/workflows/kinnan-sim-v2-reuse-diagnostic.yml'

concurrency:
  group: kinnan-sim-v2-reuse-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-v2-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew-src
          cd /tmp/manabrew-src
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew-src -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - name: Cold target seed
        run: |
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant P00_F10 --fixed-seat 0 --seeds 1720003 \
            --jvm-reuse 1 --xmx 1536m --xms 192m --max-round 4 --max-seconds 90 \
            --cache-dir .sim-cache/diag-cold --engine-id "$MANABREW_REF:diag-cold" --retain-traces none --output out/cold.json
      - name: Persistent target seed first
        run: |
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant P00_F10 --fixed-seat 0 --seeds 1720003 \
            --jvm-reuse 4 --xmx 1280m --xms 192m --max-round 4 --max-seconds 90 \
            --cache-dir .sim-cache/diag-first --engine-id "$MANABREW_REF:diag-first" --retain-traces none --output out/first.json
      - name: Persistent target after prior games
        run: |
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant P00_F10 --fixed-seat 0 --seeds 1720000 1720002 1720003 \
            --jvm-reuse 4 --xmx 1280m --xms 192m --max-round 4 --max-seconds 90 \
            --cache-dir .sim-cache/diag-seq --engine-id "$MANABREW_REF:diag-seq" --retain-traces none --output out/sequence.json
      - name: Persistent target after one prior game
        run: |
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant P00_F10 --fixed-seat 0 --seeds 1720002 1720003 \
            --jvm-reuse 4 --xmx 1280m --xms 192m --max-round 4 --max-seconds 90 \
            --cache-dir .sim-cache/diag-oneprior --engine-id "$MANABREW_REF:diag-oneprior" --retain-traces none --output out/oneprior.json
      - name: Classify reuse effect
        run: |
          python3 - <<'PY'
          import json
          def target(path):
              rows=json.load(open(path))
              return next(x for x in rows if x['seed']==1720003)
          rows={k:target(v) for k,v in {
              'cold':'out/cold.json','first':'out/first.json','sequence':'out/sequence.json','oneprior':'out/oneprior.json'
          }.items()}
          fields=('firstAssemblyTurn','firstAttemptTurn','strictProtectedT4','status','primaryFailureCode','prompts')
          report={k:{f:r.get(f) for f in fields} for k,r in rows.items()}
          print(json.dumps(report,indent=2))
          json.dump(report,open('out/report.json','w'),indent=2)
          cold={f:rows['cold'].get(f) for f in ('firstAssemblyTurn','firstAttemptTurn','strictProtectedT4')}
          first={f:rows['first'].get(f) for f in cold}
          seq={f:rows['sequence'].get(f) for f in cold}
          if first != cold:
              print('CLASSIFICATION: persistence changes target even when it is first game')
          elif seq != cold:
              print('CLASSIFICATION: cross-game reuse contamination confirmed')
          else:
              print('CLASSIFICATION: target matched; prior failure may involve ultra hotpatch/parallel layer')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-reuse-diagnostic
          path: out/
          retention-days: 14
