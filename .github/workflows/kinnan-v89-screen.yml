name: Kinnan v89 screen
on:
  push:
    branches:
      - agent/kinnan-m25-robustness
    paths:
      - .runs/kinnan-v89.txt
permissions:
  contents: read
env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        build: [B0, B2, M25C1, M25C2, M25C3, M25C4, M25C5, M25C6]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 engine-tests/generate_m25_mutations.py
      - run: |
          sudo apt-get update
          sudo apt-get install -y maven
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
      - run: |
          START=$((500000 + ${{ matrix.shard }} * 32))
          END=$((START + 31))
          SEEDS=$(seq "$START" "$END" | tr '\n' ' ')
          python3 engine-tests/manabrew_pilot_v89.py /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ --variant "${{ matrix.build }}" --seeds $SEEDS --seat-offset 0 --max-round 4 --max-prompts 3500 --max-seconds 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v89-${{ matrix.build }}-${{ matrix.shard }}
          path: engine-tests/results/
          retention-days: 14
