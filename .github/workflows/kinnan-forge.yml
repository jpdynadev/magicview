name: Kinnan Manabrew phase-aware benchmark v6

on:
  pull_request:
    branches: [main]
    paths:
      - 'engine-tests/**'
      - '.github/workflows/kinnan-forge.yml'

permissions:
  contents: read

jobs:
  manabrew-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Validate exact Commander decks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('engine-tests/decks').glob('*.dck')):
              sec=None; n=0
              for raw in p.read_text().splitlines():
                  s=raw.strip()
                  if s.startswith('[') and s.endswith(']'):
                      sec=s.lower(); continue
                  if sec in ('[commander]','[main]') and s and s[0].isdigit() and ' ' in s:
                      n += int(s.split(' ',1)[0])
              print(p.name, n)
              assert n == 100, (p, n)
          k=Path('engine-tests/decks/Kinnan_TestB.dck').read_text()
          assert '\n1 Prophet of Distortion\n' in k
          assert '\n1 Goblin Cannon\n' in k
          assert '\n1 Force of Negation\n' not in k
          assert '\n1 Mindbreak Trap\n' not in k
          PY
      - name: Clone Manabrew and Forge submodule
        run: |
          rm -rf /tmp/manabrew
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/witchesofthehill/manabrew.git /tmp/manabrew
          cd /tmp/manabrew
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/engine-tests/results-manabrew-revision.txt"
          git submodule status | tee -a "$GITHUB_WORKSPACE/engine-tests/results-manabrew-revision.txt"
      - name: Build Manabrew Forge harness
        run: |
          cd /tmp/manabrew
          node scripts/harness.mjs build 2>&1 | tee "$GITHUB_WORKSPACE/engine-tests/manabrew-build.log"
          test -f forge-harness/target/forge-harness-jar-with-dependencies.jar
      - name: Run three recursion-safe phase-aware benchmark games
        continue-on-error: true
        run: |
          rm -rf engine-tests/results
          mkdir -p engine-tests/results
          timeout 900 python3 engine-tests/manabrew_pilot_v6.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            101 202 303 | tee engine-tests/results/pilot-console.log
      - name: Print pilot summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('engine-tests/results/pilot-summary.json')
          if p.exists(): print(json.dumps(json.loads(p.read_text()), indent=2))
          else: print('No pilot summary produced')
          for e in sorted(Path('engine-tests/results').glob('pilot-errors-*.json')):
              print('\nERROR FILE', e); print(e.read_text()[:20000])
          for t in sorted(Path('engine-tests/results').glob('pilot-trace-*.json')):
              try:
                  x=json.loads(t.read_text())
                  print('\nTRACE', t.name, 'prompts=',len(x))
                  print(json.dumps(x[-20:], indent=2)[:42000])
              except Exception as exc: print('trace read failed', t, exc)
          PY
      - name: Upload Manabrew benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinnan-manabrew-v6-${{ github.sha }}
          path: |
            engine-tests/results/
            engine-tests/manabrew-build.log
            engine-tests/results-manabrew-revision.txt
          if-no-files-found: warn
          retention-days: 7
