name: Kinnan Forge engine diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'engine-tests/**'
      - '.github/workflows/kinnan-forge.yml'

permissions:
  contents: read

jobs:
  forge-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install runtime helpers
        run: sudo apt-get update && sudo apt-get install -y xvfb bzip2

      - name: Validate Commander deck sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('engine-tests/decks').glob('*.dck')):
              sec=None; commanders=[]; main=[]
              for raw in p.read_text().splitlines():
                  s=raw.strip()
                  if s.startswith('[') and s.endswith(']'):
                      sec=s.lower(); continue
                  if s and s[0].isdigit() and ' ' in s:
                      _, card=s.split(' ',1)
                      card=card.split('|',1)[0].strip()
                      if sec=='[commander]': commanders.append(card)
                      elif sec=='[main]': main.append(card)
              print(f'{p.name}: commanders={len(commanders)} main={len(main)} total={len(commanders)+len(main)}')
              assert len(commanders)+len(main)==100, p
          PY

      - name: Download latest Forge desktop snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/forge-download /tmp/forge-extract
          mkdir -p /tmp/forge-download /tmp/forge-extract engine-tests/results
          gh release download daily-snapshots -R Card-Forge/forge -p '*.tar.bz2' -D /tmp/forge-download
          ls -lah /tmp/forge-download | tee engine-tests/results/downloaded-assets.txt
          for f in /tmp/forge-download/*.tar.bz2; do
            echo "Extracting $f"
            tar -xjf "$f" -C /tmp/forge-extract || true
          done
          find /tmp/forge-extract -maxdepth 5 -type f | sort | tee engine-tests/results/extracted-files.txt

      - name: Locate Forge desktop jar
        id: forge
        run: |
          JAR=$(find /tmp/forge-extract -type f -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -n 1 || true)
          if [ -z "$JAR" ]; then
            echo 'No Forge desktop jar found after extraction.' | tee engine-tests/results/engine-error.txt
            exit 1
          fi
          echo "forge_jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "forge_dir=$(dirname "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Using Forge desktop jar: $JAR" | tee engine-tests/results/forge-jar.txt
          java -version 2>&1 | tee engine-tests/results/java-version.txt

      - name: Install test decks into Forge Commander directory
        run: |
          mkdir -p "$HOME/.forge/decks/commander"
          cp "$GITHUB_WORKSPACE"/engine-tests/decks/*.dck "$HOME/.forge/decks/commander/"
          ls -lah "$HOME/.forge/decks/commander/" | tee "$GITHUB_WORKSPACE/engine-tests/results/installed-decks.txt"

      - name: Run 5 real Forge Commander confirmation games
        id: sim
        continue-on-error: true
        run: |
          set -o pipefail
          (
            cd '${{ steps.forge.outputs.forge_dir }}'
            xvfb-run -a java -Xmx3g -jar '${{ steps.forge.outputs.forge_jar }}' sim \
              -d Kinnan_TestB.dck RogSi_2026.dck Blue_Farm_2026.dck RogThras_2026.dck \
              -f commander \
              -n 5 \
              -c 15
          ) 2>&1 | tee "$GITHUB_WORKSPACE/engine-tests/results/forge-confirmation.log"

      - name: Extract useful diagnostics
        if: always()
        run: |
          {
            echo '=== Game results ==='
            grep -Ei 'Stopping slow match as draw|Game Result:|Match Result:' engine-tests/results/forge-confirmation.log 2>/dev/null || true
            echo
            echo '=== Error / unsupported / deck lines ==='
            grep -Ei 'error|exception|unsupported|unknown card|not found|invalid|deck' engine-tests/results/forge-confirmation.log 2>/dev/null | tail -300 || true
            echo
            echo '=== Kinnan / combo mentions ==='
            grep -Ei 'Kinnan Test B|Kinnan, Bonder Prodigy|Basalt Monolith|Power Artifact|Freed from the Real|Pemmin|Thrasios|Trophy Mage|Agatha' engine-tests/results/forge-confirmation.log 2>/dev/null | tail -500 || true
            echo
            echo '=== Last 300 lines ==='
            tail -300 engine-tests/results/forge-confirmation.log 2>/dev/null || true
          } | tee engine-tests/results/confirmation-summary.txt

      - name: Upload raw Forge results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinnan-forge-confirmation-${{ github.sha }}
          path: engine-tests/results/
          if-no-files-found: warn
          retention-days: 7
