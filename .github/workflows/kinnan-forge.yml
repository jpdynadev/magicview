name: Kinnan Manabrew interactive diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'engine-tests/**'
      - '.github/workflows/kinnan-forge.yml'

permissions:
  contents: read

jobs:
  manabrew-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Validate Commander decks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('engine-tests/decks').glob('*.dck')):
              sec=None; n=0
              for raw in p.read_text().splitlines():
                  s=raw.strip()
                  if s.startswith('[') and s.endswith(']'):
                      sec=s.lower(); continue
                  if sec in ('[commander]','[main]') and s and s[0].isdigit() and ' ' in s:
                      n += int(s.split(' ',1)[0])
              print(p.name, n)
              assert n == 100, (p, n)
          PY

      - name: Clone Manabrew and Forge submodule
        run: |
          rm -rf /tmp/manabrew
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/witchesofthehill/manabrew.git /tmp/manabrew
          cd /tmp/manabrew
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/engine-tests/results-manabrew-revision.txt"
          git submodule status | tee -a "$GITHUB_WORKSPACE/engine-tests/results-manabrew-revision.txt"

      - name: Build Manabrew Forge harness
        run: |
          cd /tmp/manabrew
          node scripts/harness.mjs build 2>&1 | tee "$GITHUB_WORKSPACE/engine-tests/manabrew-build.log"
          test -f forge-harness/target/forge-harness-jar-with-dependencies.jar

      - name: Run interactive Commander smoke test
        run: |
          rm -rf engine-tests/results
          mkdir -p engine-tests/results
          python3 engine-tests/manabrew_smoke.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/

      - name: Print captured prompt summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('engine-tests/results/manabrew-smoke-summary.json')
          if p.exists():
              x=json.loads(p.read_text())
              print('PROMPT:')
              print(json.dumps(x.get('prompt'), indent=2)[:12000])
              print('SNAPSHOT KEYS:', list(x.get('snapshot',{}).keys()) if isinstance(x.get('snapshot'),dict) else type(x.get('snapshot')))
          else:
              print('No smoke summary produced')
          PY

      - name: Upload Manabrew diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinnan-manabrew-smoke-${{ github.sha }}
          path: |
            engine-tests/results/
            engine-tests/manabrew-build.log
            engine-tests/results-manabrew-revision.txt
          if-no-files-found: warn
          retention-days: 7
