name: Kinnan v117 Tournament Idle Forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v117-tournament-idle-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v117-tournament-idle-forensic
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v117-tournament-idle-forensic-9000p-320s

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/apply_arch_v112_payment_repair.py
          python3 engine-tests/apply_arch_v113_payment_scope_fix.py
          python3 engine-tests/apply_arch_v114_monolith_affordability_fix.py
          python3 engine-tests/apply_arch_v115_monolith_payment_progress_fix.py
          python3 engine-tests/apply_arch_v116_replicate_number_fix.py
          python3 engine-tests/apply_arch_v117_fourarch_roles.py
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-v117-tournament-forensic.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: v117-tournament-forensic-runtime
          path: manabrew-v117-tournament-forensic.tgz
          compression-level: 0
          retention-days: 2

  replay:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [F10, TOURNAMENT_SIEGE_2026_LOGAN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: v117-tournament-forensic-runtime, path: runtime}
      - name: Replay exact canonical key with full forensic tails
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-v117-tournament-forensic.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/apply_arch_v112_payment_repair.py
          python3 engine-tests/apply_arch_v113_payment_scope_fix.py
          python3 engine-tests/apply_arch_v114_monolith_affordability_fix.py
          python3 engine-tests/apply_arch_v115_monolith_payment_progress_fix.py
          python3 engine-tests/apply_arch_v116_replicate_number_fix.py
          python3 engine-tests/apply_arch_v117_fourarch_roles.py
          export MANABREW_HARNESS_TRACE="$PWD/out/${VARIANT}-harness-trace.log"
          CACHE=".sim-cache/v117-forensic-${GITHUB_RUN_ID}-${VARIANT}-s1-5010140-balanced"
          ENGINE="$MANABREW_REF:arch-v117-tournament-idle-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:s1:5010140:balanced"
          set +e
          CEDH_POD=balanced python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant "$VARIANT" --fixed-seat 1 --seeds 5010140 \
            --max-round 4 --max-prompts 9000 --max-seconds 320 --jvm-reuse 1 \
            --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces all \
            --engine-id "$ENGINE" --output "out/${VARIANT}.json" \
            > "out/${VARIANT}.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "out/${VARIANT}.rc"
          cat "out/${VARIANT}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v117-tournament-forensic-${{ matrix.variant }}
          path: out/**
          if-no-files-found: error
          retention-days: 5
