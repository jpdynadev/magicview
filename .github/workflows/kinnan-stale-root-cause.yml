name: Kinnan idle-timeout root-cause forensic

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-stale-root-cause.txt]

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: idle-regression-forensic-v10

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-idle-forensic-v10-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/apply_manabrew_repairs.py') }}
      - name: Build repaired runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          python3 "$GITHUB_WORKSPACE/engine-tests/apply_manabrew_repairs.py" /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: idle-forensic-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {seat: 0, seed: 1960002, label: fail-s0}
          - {seat: 1, seed: 1960071, label: fail-s1}
          - {seat: 2, seed: 1960124, label: fail-s2}
          - {seat: 3, seed: 1960162, label: fail-s3}
          - {seat: 0, seed: 1960000, label: control-s0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: idle-forensic-runtime, path: runtime}
      - name: Reproduce with full prompt/action/Forge evidence
        env:
          SEED: ${{ matrix.seed }}
          SEAT: ${{ matrix.seat }}
          LABEL: ${{ matrix.label }}
          MANABREW_HARNESS_TRACE: ${{ github.workspace }}/out/harness-actions-${{ matrix.label }}.log
        run: |
          mkdir -p /tmp/manabrew out engine-tests/results
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          set +e
          python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant F10 --fixed-seat "$SEAT" --seeds "$SEED" \
            --max-round 4 --max-prompts 5000 --max-seconds 160 \
            --jvm-reuse 1 --xmx 1280m --xms 192m \
            --cache-dir ".sim-cache/idle-forensic-v10-${LABEL}" --retain-traces all \
            --engine-id "$MANABREW_REF:idle-forensic-v10:${LABEL}" \
            --output "out/result-${LABEL}.json" 2>&1 | tee "out/worker-${LABEL}.log"
          RC=${PIPESTATUS[0]}
          cp engine-tests/results/pilot-*"-${SEED}-"* out/ 2>/dev/null || true
          find engine-tests/results -maxdepth 1 -type f -name "*${SEED}*" -exec cp {} out/ \; || true
          echo "$RC" > "out/exit-${LABEL}.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-forensic-${{ matrix.label }}
          path: out/**
          if-no-files-found: error
          retention-days: 5

  aggregate:
    needs: reproduce
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - uses: actions/download-artifact@v4
        with:
          pattern: idle-forensic-*
          path: forensic
          merge-multiple: true
      - name: Aggregate regression evidence
        run: |
          python3 - <<'PY'
          import glob,json,os
          rows=[]
          for path in sorted(glob.glob('forensic/result-*.json')):
              try:
                  d=json.load(open(path)); r=d[0] if isinstance(d,list) and d else d
                  if isinstance(r,dict): rows.append(r)
              except Exception as exc: rows.append({'path':path,'parseError':repr(exc)})
          completed={'game_over','horizon_complete'}
          out={'schema':'idle-timeout-regression-v10','sourceRunId':os.environ.get('GITHUB_RUN_ID'),
               'expected':[[0,1960002],[1,1960071],[2,1960124],[3,1960162],[0,1960000]],
               'records':len(rows),'valid':sum(r.get('status') in completed for r in rows),
               'idleTimeouts':sum(r.get('status')=='idle_timeout' for r in rows),
               'stalePromptTimeouts':sum(r.get('status')=='stale_prompt_timeout' for r in rows),
               'wallTimeouts':sum(r.get('status')=='wall_timeout' for r in rows),'rows':rows}
          os.makedirs('engine-tests/results/idle-regression-forensic',exist_ok=True)
          json.dump(out,open('engine-tests/results/idle-regression-forensic/latest.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Commit regression evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine-tests/results/idle-regression-forensic/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record idle-timeout regression forensic evidence [skip ci]'
          git push origin HEAD:agent/kinnan-expanded-architecture
