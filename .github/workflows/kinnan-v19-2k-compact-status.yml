name: Kinnan v19 2k compact status

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v19-2k-compact-status.txt]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - name: Read latest high-value run summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; branch='agent/kinnan-expanded-architecture'
          wfs=[
              'kinnan-v19-druid-tutor-2k.yml',
              'kinnan-v19-turbo-2k-confirm.yml',
              'kinnan-v19-copy-tutor-2k.yml',
              'kinnan-v19-tutor-pair-2k.yml',
              'kinnan-v19-druid-key-forensic.yml',
              'kinnan-v19-copy-tutor-forensic.yml',
              'kinnan-v19-copy-tutor-key-forensic.yml',
              'kinnan-v19-tutor-pair-key-forensic.yml',
              'kinnan-v19-tutor-pair-shared-key-forensic.yml',
              'kinnan-v19-tutor-pair-jvm-memory-forensic.yml',
              'kinnan-v19-shared-key-memory-forensic.yml',
          ]
          out={}
          def gh(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          for wf in wfs:
              runs=gh(f'/repos/{repo}/actions/workflows/{wf}/runs?branch={branch}&per_page=1').get('workflow_runs',[])
              if not runs: out[wf]=None; continue
              r=runs[0]; rid=int(r['id']); jobs=gh(f'/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs',[])
              arts=gh(f'/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
              out[wf]={'id':rid,'status':r.get('status'),'conclusion':r.get('conclusion'),'createdAt':r.get('created_at'),'updatedAt':r.get('updated_at'),'htmlUrl':r.get('html_url'),'failedJobs':[{'id':j['id'],'name':j['name'],'conclusion':j.get('conclusion')} for j in jobs if j.get('conclusion') not in (None,'success','skipped')],'jobCounts':{},'reports':[{'id':a['id'],'name':a['name']} for a in arts if 'report' in a['name'] or 'forensic' in a['name']]}
              for j in jobs:
                  k=str(j.get('conclusion') or j.get('status')); out[wf]['jobCounts'][k]=out[wf]['jobCounts'].get(k,0)+1
          p=pathlib.Path('status/kinnan-v19-2k-compact-status.json'); p.parent.mkdir(exist_ok=True); p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(p.read_text())
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- status/kinnan-v19-2k-compact-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record compact Kinnan v19 high-value status [skip ci]'
          git push origin HEAD:agent/kinnan-expanded-architecture
