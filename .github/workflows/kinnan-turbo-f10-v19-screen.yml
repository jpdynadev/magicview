name: Kinnan Turbo F10 v19 paired 200 screen

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-turbo-f10-v19-screen.txt]

concurrency:
  group: kinnan-turbo-f10-v19-screen
  cancel-in-progress: true

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '0'
  SIM_V2_PROFILE: arch-repaired-v19-turbo-paired-200

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
      - name: Build exact repaired runtime
        run: |
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-turbo-v19.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - name: Validate exact decks and pilot
        run: |
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          import engine_tests_placeholder
          PY
        shell: bash
        continue-on-error: true
      - name: Validate deck cardinality and pilot identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for key in ('F10','TURBO_F10'):
              p=Path('engine-tests/decks')/f'Kinnan_ARCH_{key}.dck'
              text=p.read_text().splitlines(); start=text.index('[Main]')+1
              cards=[line.split(' ',1)[1] for line in text[start:] if line.strip()]
              assert len(cards)==99 and len(set(cards))==99,(key,len(cards),len(set(cards)))
          adv=Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          assert 'arch-aware-v1.9-adversarial' in adv
          print('deck/pilot validation ok')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-v19-runtime
          path: manabrew-turbo-v19.tgz
          compression-level: 0
          retention-days: 2

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [F10, TURBO_F10]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: turbo-v19-runtime, path: runtime}
      - name: Run 50 strict paired adversarial keys
        env:
          VARIANT: ${{ matrix.variant }}
          SEAT: ${{ matrix.seat }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out/valid out/attempts
          tar -C /tmp/manabrew -xzf runtime/manabrew-turbo-v19.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          EXP_ARGS=(
            --exposure-card 'Tezzeret the Seeker'
            --exposure-card 'Rhystic Study'
            --exposure-card 'Sylvan Library'
            --exposure-card 'Energy Refractor'
            --exposure-card 'Hydroelectric Specimen'
            --exposure-card "Green Sun's Zenith"
            --exposure-card 'Eldritch Evolution'
            --exposure-card 'Tribute Mage'
            --exposure-card 'Devoted Druid'
            --exposure-card 'Copy Artifact'
          )
          BASE=$((2300000 + SEAT * 100))
          : > "out/${VARIANT}-seat${SEAT}-errors.ndjson"
          for OFFSET in $(seq 0 49); do
            SEED=$((BASE + OFFSET))
            case $((OFFSET % 4)) in
              0) POD=balanced ;;
              1) POD=turbo ;;
              2) POD=midrange ;;
              3) POD=mixed ;;
            esac
            OK=0
            for TRY in 1 2 3; do
              ATT="out/attempts/${VARIANT}-s${SEAT}-seed${SEED}-${POD}-try${TRY}.json"
              CACHE=".sim-cache/turbo-v19-${GITHUB_RUN_ID}-${VARIANT}-s${SEAT}-${SEED}-${POD}-try${TRY}"
              ENGINE="$MANABREW_REF:arch-v19-turbo-paired:${GITHUB_RUN_ID}:${GITHUB_SHA}:try${TRY}"
              set +e
              CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py \
                /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
                /tmp/manabrew/forge/forge-gui/ \
                --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" \
                --max-round 4 --max-prompts 5000 --max-seconds 160 --jvm-reuse 1 \
                --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures \
                --engine-id "$ENGINE" "${EXP_ARGS[@]}" --output "$ATT" \
                > "out/attempts/${VARIANT}-s${SEAT}-seed${SEED}-${POD}-try${TRY}.log" 2>&1
              RC=$?
              set -e
              STATUS=$(python3 - "$ATT" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) and d else d
              print(r.get('status','missing') if isinstance(r,dict) else 'missing')
          except Exception: print('missing')
          PY
              )
              if [ "$STATUS" = game_over ] || [ "$STATUS" = horizon_complete ]; then
                python3 - "$ATT" "$VARIANT" "$SEAT" "$SEED" "$POD" <<'PY'
          import json,sys
          p,v,seat,seed,pod=sys.argv[1:]
          d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
          assert r.get('variant')==v
          assert int(r.get('kinnanSeat'))==int(seat)
          assert int(r.get('seed'))==int(seed)
          assert r.get('podProfile')==pod
          assert r.get('pilotVersion')=='arch-aware-v1.9-adversarial',r.get('pilotVersion')
          PY
                cp "$ATT" "out/valid/${VARIANT}-s${SEAT}-seed${SEED}.json"
                OK=1; break
              fi
              printf '{"variant":"%s","seat":%s,"seed":%s,"pod":"%s","try":%s,"status":"%s","rc":%s}\n' "$VARIANT" "$SEAT" "$SEED" "$POD" "$TRY" "$STATUS" "$RC" >> "out/${VARIANT}-seat${SEAT}-errors.ndjson"
            done
            [ "$OK" -eq 1 ] || echo "UNRESOLVED $VARIANT $SEAT $SEED $POD" >&2
          done
          python3 - "$VARIANT" "$SEAT" <<'PY'
          import glob,json,sys
          v=sys.argv[1]; seat=int(sys.argv[2]); rows=[]
          for p in glob.glob(f'out/valid/{v}-s{seat}-seed*.json'):
              d=json.load(open(p)); rows.append(d[0] if isinstance(d,list) else d)
          keys={(int(r['seed']),int(r['kinnanSeat']),r.get('podProfile')) for r in rows if r.get('status') in {'game_over','horizon_complete'}}
          print({'variant':v,'seat':seat,'valid':len(rows),'keys':len(keys)})
          assert len(rows)==50 and len(keys)==50
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo-v19-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/**
          if-no-files-found: error
          retention-days: 10

  aggregate:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - uses: actions/download-artifact@v4
        with:
          pattern: turbo-v19-*
          path: all
      - name: Build and enforce strict paired report
        run: |
          python3 - <<'PY'
          import collections,glob,json,math,pathlib
          variants=['F10','TURBO_F10']; valid_status={'game_over','horizon_complete'}
          cuts={'Tezzeret the Seeker','Rhystic Study','Sylvan Library','Energy Refractor','Hydroelectric Specimen'}
          adds={"Green Sun's Zenith",'Eldritch Evolution','Tribute Mage','Devoted Druid','Copy Artifact'}
          rows={v:[] for v in variants}
          for p in glob.glob('all/**/valid/*.json',recursive=True):
              try:
                  d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
                  if r.get('variant') in rows: rows[r['variant']].append(r)
              except Exception as e: print('PARSE',p,e)
          def key(r): return (int(r['seed']),int(r['kinnanSeat']),str(r.get('podProfile')))
          def met(r,m):
              if m=='assemblyT4': return (r.get('firstAssemblyTurn') or 99)<=4
              if m=='attemptT4': return (r.get('firstAttemptTurn') or 99)<=4
              return bool(r.get(m))
          report={'profile':'arch-repaired-v19-turbo-paired-200','variants':{},'paired':{},'strictValid':False}
          maps={}
          for v in variants:
              rr=rows[v]; good=[r for r in rr if r.get('status') in valid_status]
              km={key(r):r for r in good}; maps[v]=km
              exposed_set=cuts if v=='F10' else adds
              exposed=[r for r in good if exposed_set & set(r.get('exposureCards') or [])]
              st={'records':len(rr),'valid':len(good),'uniqueKeys':len(km),'statuses':dict(collections.Counter(r.get('status') for r in rr)),
                  'pilotVersions':sorted(set(r.get('pilotVersion') for r in good)),'deckHashes':sorted(set(r.get('variantDeckSha256') for r in good)),
                  'assemblyT4':sum(met(r,'assemblyT4') for r in good),'attemptT4':sum(met(r,'attemptT4') for r in good),
                  'protectedT4':sum(met(r,'strictProtectedT4') for r in good),'wins':sum(met(r,'kinnanWon') for r in good),
                  'mulligans':sum(int(r.get('mulligans') or 0) for r in good),'failureCodes':dict(collections.Counter(r.get('primaryFailureCode') for r in good)),
                  'exposed':len(exposed),'exposedProtectedT4':sum(met(r,'strictProtectedT4') for r in exposed),'pods':{},'seats':{}}
              for pod in ('balanced','turbo','midrange','mixed'):
                  x=[r for r in good if r.get('podProfile')==pod]
                  st['pods'][pod]={'n':len(x),'assemblyT4':sum(met(r,'assemblyT4') for r in x),'attemptT4':sum(met(r,'attemptT4') for r in x),'protectedT4':sum(met(r,'strictProtectedT4') for r in x),'wins':sum(met(r,'kinnanWon') for r in x)}
              for s in range(4):
                  x=[r for r in good if int(r.get('kinnanSeat',-1))==s]
                  st['seats'][str(s)]={'n':len(x),'assemblyT4':sum(met(r,'assemblyT4') for r in x),'attemptT4':sum(met(r,'attemptT4') for r in x),'protectedT4':sum(met(r,'strictProtectedT4') for r in x),'wins':sum(met(r,'kinnanWon') for r in x)}
              report['variants'][v]=st
          b,t=maps['F10'],maps['TURBO_F10']; common=sorted(set(b)&set(t))
          def mc(m):
              a=sum(met(t[k],m) and not met(b[k],m) for k in common); c=sum(met(b[k],m) and not met(t[k],m) for k in common); n=a+c
              p=1.0 if not n else min(1.0,2*sum(math.comb(n,i) for i in range(min(a,c)+1))/(2**n))
              return {'turboOnly':a,'f10Only':c,'discordant':n,'pTwoSided':p}
          for m in ('assemblyT4','attemptT4','strictProtectedT4','kinnanWon'):
              tv=sum(met(t[k],m) for k in common); bv=sum(met(b[k],m) for k in common)
              report['paired'][m]={'keys':len(common),'turbo':tv,'f10':bv,'deltaRate':(tv-bv)/len(common) if common else None,'mcnemar':mc(m)}
          exposure=[k for k in common if (adds & set(t[k].get('exposureCards') or [])) or (cuts & set(b[k].get('exposureCards') or []))]
          report['paired']['changedSlotExposure']={'keys':len(exposure),'protectedTurbo':sum(met(t[k],'strictProtectedT4') for k in exposure),'protectedF10':sum(met(b[k],'strictProtectedT4') for k in exposure)}
          report['strictValid']=(all(report['variants'][v]['records']==200 and report['variants'][v]['valid']==200 and report['variants'][v]['uniqueKeys']==200 and report['variants'][v]['pilotVersions']==['arch-aware-v1.9-adversarial'] for v in variants) and len(common)==200 and set(b)==set(t))
          pathlib.Path('turbo-v19-paired-200-report.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps(report,indent=2,sort_keys=True))
          if not report['strictValid']: raise SystemExit('STRICT_PAIRING_FAILED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo-v19-paired-200-report
          path: turbo-v19-paired-200-report.json
          retention-days: 14
      - name: Commit durable report
        if: success()
        run: |
          mkdir -p results
          cp turbo-v19-paired-200-report.json results/kinnan-turbo-v19-paired-200-latest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/kinnan-turbo-v19-paired-200-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Kinnan Turbo v19 paired 200 screen [skip ci]'
          git push origin HEAD:agent/kinnan-expanded-architecture
