name: Kinnan Full-99 Telemetry v2 Validation

on:
  push:
    branches: [agent/kinnan-full99-telemetry-v2-validation]
    paths: [.github/workflows/kinnan-full99-telemetry-v2-validation.yml]
  workflow_dispatch:

concurrency:
  group: kinnan-full99-telemetry-v2-validation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '0'
  SIM_V2_PROFILE: arch-full99-telemetry-v2-validation

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired runtime
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/generate_v151_ring_singleton.py
          for f in 112_payment_repair 113_payment_scope_fix 114_monolith_affordability_fix 115_monolith_payment_progress_fix 116_replicate_number_fix 117_fourarch_roles 118_kinnan_color_affordability_fix 119_kinnan_colored_payment_priority_fix 120_kinnan_colored_source_assignment_fix 121_kinnan_outer_affordability_fix 122_kinnan_conservative_color_reserve_fix 123_kinnan_failed_payment_step_guard 124_kinnan_payment_cancel_latch 125_kinnan_action_score_cancel_block 126_kinnan_combo_cancel_block 127_shang_legolas_roles 128_shang_spellskite_roles; do python3 engine-tests/apply_arch_v${f}.py; done
          python3 engine-tests/apply_arch_v140_combo_monolith_affordability.py
          python3 - <<'PY'
          from pathlib import Path
          for key in ('F10','F10_RING_SINGLETON'):
              p=Path('engine-tests/decks')/f'Kinnan_ARCH_{key}.dck'
              lines=p.read_text().splitlines(); cards=[x.split(' ',1)[1] for x in lines[lines.index('[Main]')+1:] if x.strip()]
              assert len(cards)==99 and len(set(cards))==99,(key,len(cards),len(set(cards)))
          PY
          rm -rf /tmp/manabrew && git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF" && git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE" && python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew && node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-full99-v2.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: full99-v2-runtime
          path: manabrew-full99-v2.tgz
          compression-level: 0
          retention-days: 3

  validate-game:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [F10, F10_RING_SINGLETON]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v5
        with: {name: full99-v2-runtime, path: runtime}
      - name: Run one canonical telemetry-validation game
        env:
          VARIANT: ${{ matrix.variant }}
          SEAT: ${{ matrix.seat }}
          CARD_TELEMETRY_DIR: out/card-telemetry
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out/valid out/raw-action-traces
          tar -C /tmp/manabrew -xzf runtime/manabrew-full99-v2.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/generate_v151_ring_singleton.py
          for f in 112_payment_repair 113_payment_scope_fix 114_monolith_affordability_fix 115_monolith_payment_progress_fix 116_replicate_number_fix 117_fourarch_roles 118_kinnan_color_affordability_fix 119_kinnan_colored_payment_priority_fix 120_kinnan_colored_source_assignment_fix 121_kinnan_outer_affordability_fix 122_kinnan_conservative_color_reserve_fix 123_kinnan_failed_payment_step_guard 124_kinnan_payment_cancel_latch 125_kinnan_action_score_cancel_block 126_kinnan_combo_cancel_block 127_shang_legolas_roles 128_shang_spellskite_roles; do python3 engine-tests/apply_arch_v${f}.py; done
          python3 engine-tests/apply_arch_v140_combo_monolith_affordability.py
          SEED=$((7010000 + SEAT))
          case "$SEAT" in 0) POD=balanced;; 1) POD=turbo;; 2) POD=midrange;; 3) POD=mixed;; esac
          OUT="out/valid/${VARIANT}-s${SEAT}-seed${SEED}-${POD}.json"
          CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch_v142_cardtelemetry.py /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" --max-round 4 --max-prompts 7000 --max-seconds 240 --jvm-reuse 1 --xmx 1280m --xms 192m --cache-dir ".sim-cache/full99-${GITHUB_RUN_ID}-${VARIANT}-s${SEAT}" --retain-traces all --engine-id "$MANABREW_REF:full99-v2:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:s${SEAT}:${SEED}:${POD}" --output "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) else d
          assert r.get('status') in {'game_over','horizon_complete'},r
          assert r.get('v2SessionCleanup') is True and r.get('v2SessionCleanupError') is None,r
          PY
          cp out/card-telemetry/*.json out/raw-action-traces/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full99-v2-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/**
          if-no-files-found: error
          retention-days: 30

  coverage:
    needs: validate-game
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: full99-v2-*-seat*
          path: all
      - name: Materialize and enforce exact 99-card coverage
        run: |
          set -euo pipefail
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/generate_v151_ring_singleton.py
          mkdir -p results
          python3 engine-tests/materialize_full99_telemetry.py --valid-dir all --telemetry-dir all --deck "F10=engine-tests/decks/Kinnan_ARCH_F10.dck" --deck "F10_RING_SINGLETON=engine-tests/decks/Kinnan_ARCH_F10_RING_SINGLETON.dck" --out results/full99-per-game-card.ndjson --coverage results/full99-coverage.json
          python3 - <<'PY'
          import json
          c=json.load(open('results/full99-coverage.json'))
          assert c['schemaVersion']=='kinnan-full99-card-telemetry-v2'
          assert c['validGames']==8 and c['expectedRows']==792 and c['actualRows']==792
          assert c['gamesWithExactly99']==8 and c['duplicates']==0 and not c['missingCards']
          assert c['telemetryComplete'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full99-v2-validation-results
          path: results/**
          retention-days: 30
