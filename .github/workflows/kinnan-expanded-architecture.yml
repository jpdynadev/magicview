name: Kinnan expanded architecture search

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-expanded-architecture.txt]

concurrency:
  group: kinnan-expanded-architecture
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned Manabrew/Forge
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: arch-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: [F10, COPY_CORE, COPY_CREATURE, DRUID_EFFIGY, COPY_DRUID, COPY_HEAVY, COPY_ARTIFACT, COPY_PROTECTED, DRUID_TUTOR, TUTOR_DENSE, NODE_DENSE, COPY_VALUE]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: arch-runtime
          path: runtime
      - name: Restore runtime and generate decks
        run: |
          mkdir -p /tmp/manabrew
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
      - name: Run 50 paired screen games per seat
        run: |
          START=$((1800000 + ${{ matrix.seat }} * 50))
          python3 engine-tests/manabrew_pilot_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --variant '${{ matrix.variant }}' \
            --seeds $(seq "$START" $((START+49))) \
            --seat-offset '${{ matrix.seat }}' \
            --max-round 4 --max-prompts 3500 --max-seconds 100 || true
          mkdir -p out
          cp engine-tests/results/pilot-summary-${{ matrix.variant }}.json out/${{ matrix.variant }}-seat${{ matrix.seat }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 10

  rank:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      confirm: ${{ steps.rank.outputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: arch-*
          path: all
          merge-multiple: true
      - id: rank
        run: |
          python3 - <<'PY'
          import glob,json,os
          from collections import defaultdict
          completed={'game_over','horizon_complete'}
          by=defaultdict(list)
          for p in glob.glob('all/*.json'):
              try: games=json.load(open(p))
              except Exception: continue
              if games: by[games[0].get('variant','?')].extend(games)
          rows=[]
          for v,games in by.items():
              valid=[g for g in games if g.get('status') in completed]
              n=len(valid)
              rows.append({
                'variant':v,'valid':n,'errors':len(games)-n,
                'assembly':sum(bool(g.get('deterministicT4')) for g in valid),
                'attempt':sum(bool(g.get('firstAttemptTurn') is not None and g.get('firstAttemptTurn')<=4) for g in valid),
                'protected':sum(bool(g.get('protectedAttempt') and g.get('firstAttemptTurn') is not None and g.get('firstAttemptTurn')<=4) for g in valid),
                'wins':sum(bool(g.get('kinnanWon')) for g in valid),
              })
          for r in rows:
              n=max(r['valid'],1)
              for k in ('assembly','attempt','protected','wins'): r[k+'Rate']=r[k]/n
          rows.sort(key=lambda r:(r['protectedRate'],r['attemptRate'],r['assemblyRate'],r['winsRate'],r['valid']),reverse=True)
          challengers=[r['variant'] for r in rows if r['variant']!='F10'][:3]
          confirm=['F10']+challengers
          json.dump({'ranking':rows,'confirm':confirm},open('arch-screen-ranking.json','w'),indent=2)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('confirm='+json.dumps(confirm,separators=(',',':'))+'\n')
          print(json.dumps(rows,indent=2)); print('CONFIRM',confirm)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arch-screen-ranking
          path: arch-screen-ranking.json
          retention-days: 10

  confirm:
    needs: [build, rank]
    if: ${{ always() && needs.rank.outputs.confirm != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: arch-runtime
          path: runtime
      - run: |
          mkdir -p /tmp/manabrew
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
      - name: Run 50 adversarial paired games per pod/seat
        env:
          CEDH_POD: ${{ matrix.pod }}
        run: |
          case '${{ matrix.pod }}' in balanced) BASE=1810000;; turbo) BASE=1820000;; midrange) BASE=1830000;; mixed) BASE=1840000;; esac
          START=$((BASE + ${{ matrix.seat }} * 50))
          python3 engine-tests/manabrew_pilot_arch_adv.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --variant '${{ matrix.variant }}' \
            --seeds $(seq "$START" $((START+49))) \
            --seat-offset '${{ matrix.seat }}' \
            --max-round 5 --max-prompts 4500 --max-seconds 130 || true
          mkdir -p out
          cp engine-tests/results/pilot-summary-${{ matrix.variant }}.json out/${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-confirm-${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 14

  final:
    needs: [rank, confirm]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: arch-confirm-*
          path: all
          merge-multiple: true
      - name: Aggregate confirmation
        run: |
          python3 - <<'PY'
          import glob,json,os,re
          from collections import defaultdict
          completed={'game_over','horizon_complete'}; by=defaultdict(list)
          for p in glob.glob('all/*.json'):
              m=re.match(r'(.+)-(balanced|turbo|midrange|mixed)-seat([0-3])\.json$',os.path.basename(p))
              if not m: continue
              v,pod,seat=m.group(1),m.group(2),int(m.group(3))
              games=json.load(open(p)); valid=[g for g in games if g.get('status') in completed]
              by[v].extend(valid)
          rows=[]
          for v,games in by.items():
              n=len(games)
              prot=sum(bool(g.get('protectedAttempt') and g.get('firstAttemptTurn') is not None and g.get('firstAttemptTurn')<=4) for g in games)
              att=sum(bool(g.get('firstAttemptTurn') is not None and g.get('firstAttemptTurn')<=4) for g in games)
              ass=sum(bool(g.get('deterministicT4')) for g in games)
              wins=sum(bool(g.get('kinnanWon')) for g in games)
              rows.append({'variant':v,'valid':n,'protected':prot,'attempt':att,'assembly':ass,'wins':wins,
                           'protectedRate':prot/max(n,1),'attemptRate':att/max(n,1),'assemblyRate':ass/max(n,1),'winRate':wins/max(n,1)})
          rows.sort(key=lambda r:(r['protectedRate'],r['attemptRate'],r['assemblyRate'],r['winRate']),reverse=True)
          json.dump({'ranking':rows},open('arch-final.json','w'),indent=2)
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kinnan-expanded-architecture-final
          path: arch-final.json
          retention-days: 14
