name: Kinnan v115 prompt-cap 7000 revalidation

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v115-promptcap-7000-revalidation.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-high-value-confirmation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '0'
  SIM_V2_PROFILE: arch-repaired-v115-promptcap-7000-240s

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [F10, F10_EVOLUTION_SINGLE]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired v1.15 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 engine-tests/apply_arch_v112_payment_repair.py
          python3 engine-tests/apply_arch_v113_payment_scope_fix.py
          python3 engine-tests/apply_arch_v114_monolith_affordability_fix.py
          python3 engine-tests/apply_arch_v115_monolith_payment_progress_fix.py
          python3 - <<'PY'
          from pathlib import Path
          adv=Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          assert 'arch-aware-v1.15-adversarial' in adv
          PY
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: Revalidate canonical prompt-cap key under 7000/240 profile
        env:
          VARIANT: ${{ matrix.variant }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/${VARIANT}-rep${REP}-seed3620191-seat2-mixed.json"
          CACHE=".sim-cache/v115-promptcap7000-${GITHUB_RUN_ID}-${VARIANT}-rep${REP}"
          ENGINE="$MANABREW_REF:arch-v115-promptcap7000:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:rep${REP}"
          CEDH_POD=mixed python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant "$VARIANT" --fixed-seat 2 --seeds 3620191 \
            --max-round 4 --max-prompts 7000 --max-seconds 240 --jvm-reuse 1 \
            --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures \
            --engine-id "$ENGINE" \
            --exposure-card 'Hydroelectric Specimen' --exposure-card 'Eldritch Evolution' \
            --output "$OUT"
          python3 - "$OUT" "$VARIANT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) else d
          assert r.get('status') in {'game_over','horizon_complete'}, r.get('status')
          assert r.get('variant') == sys.argv[2]
          assert int(r.get('seed')) == 3620191
          assert int(r.get('kinnanSeat')) == 2
          assert r.get('podProfile') == 'mixed'
          assert r.get('pilotVersion') == 'arch-aware-v1.15-adversarial'
          assert int(r.get('prompts') or 0) <= 7000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v115-promptcap7000-${{ matrix.variant }}-rep${{ matrix.rep }}
          path: out/**
          if-no-files-found: error
          retention-days: 7
