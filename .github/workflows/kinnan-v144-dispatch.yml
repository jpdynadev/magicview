name: Dispatch Kinnan v144 Dramatic Screen

on:
  push:
    branches: [agent/kinnan-v144-dramatic-repaired]
    paths: [.github/workflows/kinnan-v144-dispatch.yml]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch repaired strict 200-pair screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/kinnan-v144-dramatic-repaired-200.yml/dispatches \
            -f ref=agent/kinnan-v144-dramatic-repaired
