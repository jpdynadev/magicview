name: Kinnan simulation v2

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON array; include P00_F10 baseline'
        required: true
        default: '["P00_F10","P24_MIRROR_REFRACTOR"]'
        type: string
      screen_seed_base:
        description: 'Canonical paired screen seed base'
        required: true
        default: '2000000'
        type: string
      confirm_seed_base:
        description: 'Canonical adversarial seed base'
        required: true
        default: '2100000'
        type: string
      jvm_reuse:
        description: 'Games per Forge JVM before restart'
        required: true
        default: '6'
        type: string
      xmx:
        description: 'Forge JVM max heap'
        required: true
        default: '1536m'
        type: string

concurrency:
  group: kinnan-sim-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: "1"
  SHARD_GAMES: 25

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-v2-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build pinned runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" \
            forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
        seat: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-runtime, path: runtime}
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - id: shard
        name: Resolve canonical paired shard
        run: |
          START=$((${{ inputs.screen_seed_base }} + ${{ matrix.seat }} * 100))
          END=$((START + $SHARD_GAMES - 1))
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
      - id: result-cache
        uses: actions/cache@v4
        with:
          path: .sim-cache/v2
          key: sim-v2-screen-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/manabrew_pilot_v8.py','engine-tests/kinnan_policy_v8.py','engine-tests/sim_v2_worker.py','engine-tests/decks/Kinnan_PREC_*.dck') }}-${{ matrix.variant }}-s${{ matrix.seat }}-${{ steps.shard.outputs.start }}-${{ steps.shard.outputs.end }}
      - name: Run 25 paired screen games
        run: |
          mkdir -p out
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant '${{ matrix.variant }}' \
            --fixed-seat '${{ matrix.seat }}' \
            --seeds $(seq '${{ steps.shard.outputs.start }}' '${{ steps.shard.outputs.end }}') \
            --max-round 4 --max-prompts 3000 --max-seconds 75 \
            --jvm-reuse '${{ inputs.jvm_reuse }}' --xmx '${{ inputs.xmx }}' --xms 256m \
            --cache-dir .sim-cache/v2 --retain-traces failures --audit-every 100 \
            --output 'out/${{ matrix.variant }}-screen-seat${{ matrix.seat }}.json'
          python3 - <<'PY'
          import glob,json
          p=glob.glob('out/*.json')[0]; g=json.load(open(p))
          assert len(g)==25, (p,len(g))
          print('validated',len(g),p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-screen-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 7

  rank:
    needs: screen
    runs-on: ubuntu-24.04
    outputs:
      confirm: ${{ steps.rank.outputs.confirm }}
      best: ${{ steps.rank.outputs.best }}
      decision: ${{ steps.rank.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: sim-v2-screen-*, path: screen, merge-multiple: true}
      - id: rank
        run: |
          python3 engine-tests/sim_v2_rank.py 'screen/*.json' \
            --baseline P00_F10 \
            --output sim-v2-screen-ranking.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-screen-ranking
          path: sim-v2-screen-ranking.json
          retention-days: 14

  confirm:
    needs: [build, rank]
    if: needs.rank.outputs.decision != 'REJECT'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0, 1, 2, 3]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-runtime, path: runtime}
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - id: shard
        run: |
          case '${{ matrix.pod }}' in
            balanced) POD_OFF=0;;
            turbo) POD_OFF=10000;;
            midrange) POD_OFF=20000;;
            mixed) POD_OFF=30000;;
          esac
          START=$((${{ inputs.confirm_seed_base }} + POD_OFF + ${{ matrix.seat }} * 1000 + ${{ matrix.shard }} * $SHARD_GAMES))
          END=$((START + $SHARD_GAMES - 1))
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
      - id: result-cache
        uses: actions/cache@v4
        with:
          path: .sim-cache/v2
          key: sim-v2-adv-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/manabrew_pilot_v8.py','engine-tests/manabrew_pilot_v91_adversarial.py','engine-tests/kinnan_policy_v8.py','engine-tests/sim_v2_worker.py','engine-tests/decks/Kinnan_PREC_*.dck') }}-${{ matrix.variant }}-${{ matrix.pod }}-s${{ matrix.seat }}-q${{ matrix.shard }}-${{ steps.shard.outputs.start }}-${{ steps.shard.outputs.end }}
      - name: Run 25 adversarial games
        env:
          CEDH_POD: ${{ matrix.pod }}
        run: |
          mkdir -p out
          python3 engine-tests/sim_v2_worker.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant '${{ matrix.variant }}' \
            --fixed-seat '${{ matrix.seat }}' \
            --seeds $(seq '${{ steps.shard.outputs.start }}' '${{ steps.shard.outputs.end }}') \
            --max-round 4 --max-prompts 4000 --max-seconds 100 \
            --jvm-reuse '${{ inputs.jvm_reuse }}' --xmx '${{ inputs.xmx }}' --xms 256m \
            --cache-dir .sim-cache/v2 --retain-traces failures --audit-every 100 \
            --output 'out/${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}-shard${{ matrix.shard }}.json'
          python3 - <<'PY'
          import glob,json
          p=glob.glob('out/*.json')[0]; g=json.load(open(p))
          assert len(g)==25, (p,len(g))
          print('validated',len(g),p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-adv-${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}-shard${{ matrix.shard }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 7

  final:
    needs: [rank, confirm]
    if: always() && needs.rank.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.confirm.result == 'success'
        with: {pattern: sim-v2-adv-*, path: adv, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-screen-ranking, path: screen}
      - name: Aggregate
        run: |
          if compgen -G 'adv/*.json' >/dev/null; then
            python3 engine-tests/sim_v2_rank.py 'adv/*.json' \
              --baseline P00_F10 --output sim-v2-final.json
          else
            cp screen/sim-v2-screen-ranking.json sim-v2-final.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-final
          path: sim-v2-final.json
          retention-days: 30
