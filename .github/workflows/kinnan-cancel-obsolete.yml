name: Cancel obsolete Kinnan runs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.runs/kinnan-cancel-obsolete.txt]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Cancel obsolete runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          for RUN in 31754908883 31761716393 31765260708 31765275589; do
            code=$(curl -sS -o /tmp/cancel-$RUN.txt -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN/cancel" || true)
            echo "$RUN => HTTP $code"
            cat /tmp/cancel-$RUN.txt || true
          done
