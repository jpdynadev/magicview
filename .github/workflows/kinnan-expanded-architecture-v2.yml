name: Kinnan expanded architecture sim-v2

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-expanded-architecture-v2.txt]

concurrency:
  group: kinnan-expanded-architecture
  cancel-in-progress: true

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-root-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build pinned runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: arch-root-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  forensic:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [1800000, 1800001, 1800007, 1800013, 1800020]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: arch-root-runtime, path: runtime}
      - name: Run one cold F10 game with self-contained forensic record
        env:
          SEED: ${{ matrix.seed }}
          MANABREW_HARNESS_TRACE: ${{ github.workspace }}/out/harness-actions-${{ matrix.seed }}.log
        run: |
          mkdir -p /tmp/manabrew out engine-tests/results
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          set +e
          python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant F10 --fixed-seat 0 --seeds "$SEED" \
            --max-round 4 --max-prompts 3500 --max-seconds 100 \
            --jvm-reuse 1 --xmx 1280m --xms 192m \
            --cache-dir ".sim-cache/root-${SEED}-${GITHUB_RUN_ID}" --retain-traces all \
            --engine-id "$MANABREW_REF:root-cause-stderr-v3" \
            --output "out/F10-${SEED}.json" 2>&1 | tee "out/F10-${SEED}.log"
          RC=${PIPESTATUS[0]}
          find engine-tests/results -maxdepth 1 -type f -name "*${SEED}*" -exec cp {} out/ \; || true
          echo "$RC" > "out/exit-${SEED}.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-root-F10-${{ matrix.seed }}
          path: out/**
          if-no-files-found: error
          retention-days: 5

  aggregate:
    needs: forensic
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - uses: actions/download-artifact@v4
        with:
          pattern: arch-root-F10-*
          path: forensic
          merge-multiple: true
      - name: Build durable forensic summary
        run: |
          python3 - <<'PY'
          import glob,json,os
          rows=[]
          for path in sorted(glob.glob('forensic/F10-*.json')):
              try:
                  data=json.load(open(path))
              except Exception as exc:
                  rows.append({'path':path,'parseError':repr(exc)})
                  continue
              if isinstance(data,list): rows.extend(data)
              elif isinstance(data,dict): rows.append(data)
          out={
              'schema':'stale-root-forensic-v3',
              'sourceRunId':os.environ.get('GITHUB_RUN_ID'),
              'records':len(rows),
              'rows':rows,
          }
          os.makedirs('engine-tests/results/stale-root-forensic',exist_ok=True)
          json.dump(out,open('engine-tests/results/stale-root-forensic/latest.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Commit forensic evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine-tests/results/stale-root-forensic/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record stale root-cause forensic evidence [skip ci]'
            git push origin HEAD:agent/kinnan-expanded-architecture
          fi
