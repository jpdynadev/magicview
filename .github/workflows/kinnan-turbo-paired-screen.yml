name: Kinnan Turbo F10 paired 200 screen

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-turbo-paired-screen.txt]

concurrency:
  group: kinnan-turbo-paired-screen
  cancel-in-progress: true

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '0'
  SIM_V2_PROFILE: arch-repaired-v17-turbo-paired-200

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
      - name: Build exact repaired runtime
        run: |
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-turbo-screen.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - name: Generate and validate decks
        run: |
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          for key in ('F10','TURBO_F10'):
              p=Path('engine-tests/decks')/f'Kinnan_ARCH_{key}.dck'
              text=p.read_text().splitlines(); start=text.index('[Main]')+1
              cards=[line.split(' ',1)[1] for line in text[start:] if line.strip()]
              assert len(cards)==99 and len(set(cards))==99,(key,len(cards),len(set(cards)))
              print(key,len(cards))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kinnan-turbo-screen-runtime
          path: manabrew-turbo-screen.tgz
          compression-level: 0
          retention-days: 2

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [F10, TURBO_F10]
        pod: [balanced, turbo, midrange, mixed]
        seat: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: kinnan-turbo-screen-runtime, path: runtime}
      - name: Run exact paired screen cell
        env:
          VARIANT: ${{ matrix.variant }}
          CEDH_POD: ${{ matrix.pod }}
          SEAT: ${{ matrix.seat }}
        run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-turbo-screen.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          case "$CEDH_POD" in
            balanced) POD_INDEX=0 ;;
            turbo) POD_INDEX=1 ;;
            midrange) POD_INDEX=2 ;;
            mixed) POD_INDEX=3 ;;
            *) exit 2 ;;
          esac
          CELL=$((POD_INDEX * 4 + SEAT))
          if [ "$CELL" -lt 8 ]; then COUNT=13; else COUNT=12; fi
          BASE=$((2200000 + CELL * 100))
          SEEDS=""
          for I in $(seq 0 $((COUNT-1))); do SEEDS="$SEEDS $((BASE+I))"; done
          python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds $SEEDS \
            --max-round 4 --max-prompts 5000 --max-seconds 160 \
            --jvm-reuse 1 --xmx 1280m --xms 192m \
            --cache-dir ".sim-cache/turbo-v17-${GITHUB_RUN_ID}-${VARIANT}-${CEDH_POD}-s${SEAT}" \
            --retain-traces failures \
            --engine-id "$MANABREW_REF:arch-v17-turbo-paired:${GITHUB_SHA}" \
            --exposure-card "Tezzeret the Seeker" \
            --exposure-card "Rhystic Study" \
            --exposure-card "Sylvan Library" \
            --exposure-card "Energy Refractor" \
            --exposure-card "Hydroelectric Specimen" \
            --exposure-card "Green Sun's Zenith" \
            --exposure-card "Eldritch Evolution" \
            --exposure-card "Tribute Mage" \
            --exposure-card "Devoted Druid" \
            --exposure-card "Copy Artifact" \
            --output "out/result-${VARIANT}-${CEDH_POD}-s${SEAT}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo-screen-${{ matrix.variant }}-${{ matrix.pod }}-s${{ matrix.seat }}
          path: out/**
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: turbo-screen-*
          path: all
      - name: Build strict paired report
        run: |
          python3 - <<'PY'
          import collections,glob,json,math,pathlib
          rows=[]
          for p in glob.glob('all/**/result-*.json',recursive=True):
              try:
                  d=json.load(open(p)); rows.extend(d if isinstance(d,list) else [d])
              except Exception as e:
                  print('PARSE_ERROR',p,e)
          valid_status={'game_over','horizon_complete'}
          variants=['F10','TURBO_F10']
          cuts={'Tezzeret the Seeker','Rhystic Study','Sylvan Library','Energy Refractor','Hydroelectric Specimen'}
          adds={"Green Sun's Zenith",'Eldritch Evolution','Tribute Mage','Devoted Druid','Copy Artifact'}
          def key(r): return (int(r['seed']),int(r['kinnanSeat']),str(r.get('podProfile')))
          def metric(r,name):
              if name=='assemblyT4': return (r.get('firstAssemblyTurn') or 99)<=4
              if name=='attemptT4': return (r.get('firstAttemptTurn') or 99)<=4
              return bool(r.get(name))
          report={'profile':'arch-repaired-v17-turbo-paired-200','sourceRunId':'${{ github.run_id }}','variants':{},'paired':{},'strictValid':False}
          maps={}
          for v in variants:
              rr=[r for r in rows if r.get('variant')==v]
              good=[r for r in rr if r.get('status') in valid_status]
              km={key(r):r for r in good}
              maps[v]=km
              exposure_set=cuts if v=='F10' else adds
              exposed=[r for r in good if exposure_set & set(r.get('exposureCards') or [])]
              stats={
                'records':len(rr),'valid':len(good),'errors':len(rr)-len(good),'uniqueKeys':len(km),
                'statuses':dict(collections.Counter(r.get('status') for r in rr)),
                'deckHashes':sorted(set(r.get('variantDeckSha256') for r in good)),
                'pilotVersions':sorted(set(r.get('pilotVersion') for r in good)),
                'engineProfiles':sorted(set(r.get('executionProfile') for r in good)),
                'cacheKeys':len(set(r.get('cacheKey') for r in good)),
                'assemblyT4':sum(metric(r,'assemblyT4') for r in good),
                'attemptT4':sum(metric(r,'attemptT4') for r in good),
                'deterministicT4':sum(metric(r,'deterministicT4') for r in good),
                'protectedT4':sum(metric(r,'strictProtectedT4') for r in good),
                'wins':sum(metric(r,'kinnanWon') for r in good),
                'failureCodes':dict(collections.Counter(r.get('primaryFailureCode') for r in good)),
                'exposed':len(exposed),
                'exposedProtectedT4':sum(metric(r,'strictProtectedT4') for r in exposed),
                'pods':{},'seats':{},
              }
              for pod in ('balanced','turbo','midrange','mixed'):
                  x=[r for r in good if r.get('podProfile')==pod]
                  stats['pods'][pod]={'n':len(x),'assemblyT4':sum(metric(r,'assemblyT4') for r in x),'attemptT4':sum(metric(r,'attemptT4') for r in x),'protectedT4':sum(metric(r,'strictProtectedT4') for r in x),'wins':sum(metric(r,'kinnanWon') for r in x)}
              for seat in range(4):
                  x=[r for r in good if int(r.get('kinnanSeat',-1))==seat]
                  stats['seats'][str(seat)]={'n':len(x),'assemblyT4':sum(metric(r,'assemblyT4') for r in x),'attemptT4':sum(metric(r,'attemptT4') for r in x),'protectedT4':sum(metric(r,'strictProtectedT4') for r in x),'wins':sum(metric(r,'kinnanWon') for r in x)}
              report['variants'][v]=stats
          b=maps['F10']; t=maps['TURBO_F10']; common=sorted(set(b)&set(t))
          def exact_mcnemar(metric_name):
              x10=sum(metric(t[k],metric_name) and not metric(b[k],metric_name) for k in common)
              x01=sum(metric(b[k],metric_name) and not metric(t[k],metric_name) for k in common)
              n=x10+x01
              if not n: p=1.0
              else:
                  lo=min(x10,x01)
                  tail=sum(math.comb(n,i) for i in range(lo+1))/(2**n)
                  p=min(1.0,2*tail)
              return {'turboOnly':x10,'f10Only':x01,'discordant':n,'pTwoSided':p}
          for m in ('assemblyT4','attemptT4','deterministicT4','strictProtectedT4','kinnanWon'):
              tb=sum(metric(t[k],m) for k in common); fb=sum(metric(b[k],m) for k in common)
              report['paired'][m]={'keys':len(common),'turbo':tb,'f10':fb,'deltaRate':(tb-fb)/len(common) if common else None,'mcnemar':exact_mcnemar(m)}
          exposed_common=[k for k in common if (adds & set(t[k].get('exposureCards') or [])) or (cuts & set(b[k].get('exposureCards') or []))]
          report['paired']['changedSlotExposure']={'keys':len(exposed_common),'protectedTurbo':sum(metric(t[k],'strictProtectedT4') for k in exposed_common),'protectedF10':sum(metric(b[k],'strictProtectedT4') for k in exposed_common)}
          report['strictValid']=(
              all(report['variants'][v]['records']==200 and report['variants'][v]['valid']==200 and report['variants'][v]['uniqueKeys']==200 for v in variants)
              and len(common)==200 and set(b)==set(t)
          )
          pathlib.Path('turbo-paired-200-report.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps(report,indent=2,sort_keys=True))
          if not report['strictValid']:
              raise SystemExit('STRICT_PAIRING_FAILED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo-paired-200-report
          path: turbo-paired-200-report.json
          retention-days: 14
      - name: Commit durable report
        if: success()
        run: |
          mkdir -p results
          cp turbo-paired-200-report.json results/kinnan-turbo-paired-200-latest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/kinnan-turbo-paired-200-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Kinnan Turbo paired 200 screen [skip ci]'
          git push
