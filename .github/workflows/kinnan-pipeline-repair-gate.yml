name: Kinnan repaired pipeline gate

on:
  push:
    branches:
      - agent/kinnan-expanded-architecture
    paths:
      - "engine-tests/manabrew_pilot_arch.py"
      - "engine-tests/manabrew_pilot_v8.py"
      - "engine-tests/apply_manabrew_repairs.py"
      - ".github/workflows/kinnan-pipeline-repair-gate.yml"
  workflow_dispatch:

concurrency:
  group: kinnan-pipeline-repair-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  JAR: /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar
  FORGE_HOME: /tmp/manabrew/forge/forge-gui/

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Clone pinned runtime and apply exact-content repairs
        run: |
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew

      - name: Build clean Forge harness
        working-directory: /tmp/manabrew
        run: node scripts/harness.mjs build

      - name: Record runtime identity
        run: |
          mkdir -p engine-tests/results
          {
            echo "manabrew=$(git -C /tmp/manabrew rev-parse HEAD)"
            echo "forge=$(git -C /tmp/manabrew/forge rev-parse HEAD)"
            echo "repair_sha=$(sha256sum engine-tests/apply_manabrew_repairs.py | cut -d' ' -f1)"
            echo "pilot_sha=$(sha256sum engine-tests/manabrew_pilot_arch.py | cut -d' ' -f1)"
            echo "jar_sha=$(sha256sum $JAR | cut -d' ' -f1)"
            java -version 2>&1 | head -n 1
          } | tee engine-tests/results/runtime-manifest.txt

      - name: Exact regression seeds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf engine-tests/results/forensic
          mkdir -p engine-tests/results/forensic
          export KINNAN_RESULT_DIR="$GITHUB_WORKSPACE/engine-tests/results/forensic"
          run_case() {
            local seed="$1" seat="$2"
            echo "=== forensic seed=$seed seat=$seat ==="
            python3 engine-tests/manabrew_pilot_arch.py "$JAR" "$FORGE_HOME" \
              --variant F10 --seeds "$seed" --seat-offset "$seat" \
              --max-round 4 --max-prompts 5000 --max-seconds 160
          }
          run_case 1960000 0
          run_case 1960002 0
          run_case 1960071 1
          run_case 1960124 2
          run_case 1960162 3

      - name: Validate forensic records, not workflow color
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('engine-tests/results/forensic')
          rows=[]
          for p in sorted(root.glob('pilot-result-F10-*.json')):
              rows.append(json.loads(p.read_text()))
          if len(rows) != 5:
              raise SystemExit(f'expected 5 forensic result records, got {len(rows)}')
          valid={'game_over','horizon_complete'}
          bad=[r for r in rows if r.get('status') not in valid]
          print(json.dumps({
              'total':len(rows),
              'valid':len(rows)-len(bad),
              'statuses':{s:sum(r.get('status')==s for r in rows) for s in sorted({r.get('status') for r in rows})},
              'rows':rows,
          }, indent=2))
          if bad:
              raise SystemExit('forensic validity gate failed')
          PY

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinnan-pipeline-forensic-${{ github.run_id }}
          path: engine-tests/results/
          if-no-files-found: error
          retention-days: 90

  cold-validity:
    needs: forensic
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
      - name: Clean-build repaired runtime
        run: |
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: 32-game balanced-seat cold gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf engine-tests/results/cold
          mkdir -p engine-tests/results/cold
          export KINNAN_RESULT_DIR="$GITHUB_WORKSPACE/engine-tests/results/cold"
          for seat in 0 1 2 3; do
            for i in $(seq 0 7); do
              seed=$((1970000 + seat*100 + i))
              python3 engine-tests/manabrew_pilot_arch.py "$JAR" "$FORGE_HOME" \
                --variant F10 --seeds "$seed" --seat-offset "$seat" \
                --max-round 4 --max-prompts 5000 --max-seconds 160
            done
          done
      - name: Strict cold validity summary
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          rows=[json.loads(p.read_text()) for p in pathlib.Path('engine-tests/results/cold').glob('pilot-result-F10-*.json')]
          valid={'game_over','horizon_complete'}
          counts=collections.Counter(r.get('status') for r in rows)
          seats=collections.Counter(r.get('kinnanSeat') for r in rows if r.get('status') in valid)
          summary={'total':len(rows),'valid':sum(r.get('status') in valid for r in rows),'statuses':counts,'validBySeat':seats}
          print(json.dumps(summary, indent=2, default=dict))
          if len(rows) != 32 or summary['valid'] != 32 or any(seats[s] != 8 for s in range(4)):
              raise SystemExit('cold validity gate failed')
          pathlib.Path('engine-tests/results/cold-validity-summary.json').write_text(json.dumps(summary, indent=2, default=dict))
          PY
      - name: Upload cold validity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinnan-pipeline-cold-${{ github.run_id }}
          path: engine-tests/results/
          if-no-files-found: error
          retention-days: 90
