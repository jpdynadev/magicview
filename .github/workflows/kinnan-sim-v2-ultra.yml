name: Kinnan simulation v2 ultra

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON array; include P00_F10 baseline'
        required: true
        default: '["P00_F10","P24_MIRROR_REFRACTOR"]'
        type: string
      screen_seed_base:
        description: 'Canonical paired screen seed base'
        required: true
        default: '3000000'
        type: string
      confirm_seed_base:
        description: 'Canonical adversarial seed base'
        required: true
        default: '3100000'
        type: string
      local_workers:
        description: 'Persistent Forge JVMs per GitHub runner'
        required: true
        default: '2'
        type: string
      jvm_reuse:
        description: 'Games per JVM before recycle'
        required: true
        default: '6'
        type: string
      exposure_cards:
        description: 'Comma-separated mutation/package cards to label from generic observations'
        required: false
        default: ''
        type: string

concurrency:
  group: kinnan-sim-v2-ultra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: "1"
  SHARD_GAMES: 25
  SIM_V2_EARLY_SUCCESS: "1"
  SIM_V2_EXACT_DEADLINE: "1"
  SIM_V2_TRACE: "0"
  SIM_ENGINE_ID: 8a1380e5a59986ea3fed143b85f710f9ee3888dc:ultra-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-v2-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build pinned runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" \
            forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-ultra-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  tune:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      xmx: ${{ steps.choose.outputs.xmx }}
      status: ${{ steps.choose.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-ultra-runtime, path: runtime}
      - id: tune-cache
        uses: actions/cache@v4
        with:
          path: .sim-tuning
          key: sim-v2-heap-${{ runner.os }}-${{ runner.arch }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/manabrew_pilot_v8.py','engine-tests/kinnan_policy_v8.py','engine-tests/sim_v2_worker.py','engine-tests/sim_v2_hotpatch.py','engine-tests/sim_v2_worker_ultra.py') }}
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew .sim-tuning
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - id: choose
        name: Select smallest stable heap
        run: |
          if [ ! -s .sim-tuning/heap.json ]; then
            python3 engine-tests/sim_v2_heap_tune.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --games 4 --seed-base 3099000 --output .sim-tuning/heap.json
          fi
          XMX=$(python3 -c "import json;print(json.load(open('.sim-tuning/heap.json'))['selected'])")
          STATUS=$(python3 -c "import json;print(json.load(open('.sim-tuning/heap.json'))['status'])")
          echo "xmx=$XMX" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          cat .sim-tuning/heap.json
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-heap-tuning
          path: .sim-tuning/heap.json
          retention-days: 30

  screen:
    needs: [build, tune]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
        seat: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-ultra-runtime, path: runtime}
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - id: seeds
        run: |
          START=$((${{ inputs.screen_seed_base }} + ${{ matrix.seat }} * 100))
          END=$((START + $SHARD_GAMES - 1))
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .sim-cache/v2
          key: ultra-screen-${{ env.SIM_ENGINE_ID }}-${{ hashFiles('engine-tests/sim_v2_worker.py','engine-tests/sim_v2_hotpatch.py','engine-tests/sim_v2_worker_ultra.py','engine-tests/kinnan_policy_v8.py','engine-tests/generate_f10_precision_decks.py') }}-${{ matrix.variant }}-s${{ matrix.seat }}-${{ steps.seeds.outputs.start }}-${{ steps.seeds.outputs.end }}
      - name: Run canonical screen shard
        env:
          XMX: ${{ needs.tune.outputs.xmx }}
        run: |
          EXTRA=()
          IFS=',' read -ra CARDS <<< '${{ inputs.exposure_cards }}'
          for card in "${CARDS[@]}"; do [ -z "$card" ] || EXTRA+=(--exposure-card "$card"); done
          python3 engine-tests/sim_v2_parallel.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant '${{ matrix.variant }}' --fixed-seat '${{ matrix.seat }}' \
            --seeds $(seq '${{ steps.seeds.outputs.start }}' '${{ steps.seeds.outputs.end }}') \
            --workers '${{ inputs.local_workers }}' --jvm-reuse '${{ inputs.jvm_reuse }}' \
            --xmx "$XMX" --xms 192m --max-round 4 --max-prompts 3000 --max-seconds 75 \
            --cache-dir .sim-cache/v2 --engine-id "$SIM_ENGINE_ID" \
            --retain-traces none --audit-every 0 "${EXTRA[@]}" \
            --output 'out/${{ matrix.variant }}-screen-seat${{ matrix.seat }}.json'
          python3 - <<'PY'
          import glob,json
          p=glob.glob('out/*.json')[0]; g=json.load(open(p)); assert len(g)==25,(p,len(g))
          print('validated',len(g),p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-ultra-screen-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 14

  rank:
    needs: screen
    runs-on: ubuntu-24.04
    outputs:
      confirm: ${{ steps.rank.outputs.confirm }}
      best: ${{ steps.rank.outputs.best }}
      decision: ${{ steps.rank.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: sim-v2-ultra-screen-*, path: screen, merge-multiple: true}
      - id: rank
        run: |
          python3 engine-tests/sim_v2_rank.py 'screen/*.json' --baseline P00_F10 \
            --stage screen --output screen-ranking.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: sim-v2-ultra-screen-ranking, path: screen-ranking.json, retention-days: 30}

  wave1:
    needs: [build, tune, rank]
    if: needs.rank.outputs.decision != 'REJECT' && needs.rank.outputs.decision != 'TIE_OR_TINY_EFFECT'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0, 1, 2, 3]
    steps: &wave_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-ultra-runtime, path: runtime}
      - name: Restore runtime and decks
        run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_f10_precision_decks.py
      - id: seeds
        run: |
          case '${{ matrix.pod }}' in balanced) P=0;; turbo) P=10000;; midrange) P=20000;; mixed) P=30000;; esac
          WAVE=${WAVE_INDEX:-0}
          START=$((${{ inputs.confirm_seed_base }} + P + ${{ matrix.seat }} * 1000 + WAVE * $SHARD_GAMES))
          END=$((START + $SHARD_GAMES - 1))
          echo "start=$START" >> "$GITHUB_OUTPUT"; echo "end=$END" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .sim-cache/v2
          key: ultra-adv-${{ env.SIM_ENGINE_ID }}-${{ hashFiles('engine-tests/sim_v2_worker.py','engine-tests/sim_v2_hotpatch.py','engine-tests/sim_v2_worker_ultra.py','engine-tests/manabrew_pilot_v91_adversarial.py','engine-tests/kinnan_policy_v8.py','engine-tests/generate_f10_precision_decks.py') }}-${{ matrix.variant }}-${{ matrix.pod }}-s${{ matrix.seat }}-${{ steps.seeds.outputs.start }}-${{ steps.seeds.outputs.end }}
      - name: Run adversarial wave shard
        env:
          CEDH_POD: ${{ matrix.pod }}
          XMX: ${{ needs.tune.outputs.xmx }}
        run: |
          EXTRA=()
          IFS=',' read -ra CARDS <<< '${{ inputs.exposure_cards }}'
          for card in "${CARDS[@]}"; do [ -z "$card" ] || EXTRA+=(--exposure-card "$card"); done
          python3 engine-tests/sim_v2_parallel.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant '${{ matrix.variant }}' --fixed-seat '${{ matrix.seat }}' \
            --seeds $(seq '${{ steps.seeds.outputs.start }}' '${{ steps.seeds.outputs.end }}') \
            --workers '${{ inputs.local_workers }}' --jvm-reuse '${{ inputs.jvm_reuse }}' \
            --xmx "$XMX" --xms 192m --max-round 4 --max-prompts 4000 --max-seconds 100 \
            --cache-dir .sim-cache/v2 --engine-id "$SIM_ENGINE_ID" \
            --retain-traces none --audit-every 0 "${EXTRA[@]}" \
            --output 'out/${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}-wave'"${WAVE_INDEX:-0}"'.json'
          python3 - <<'PY'
          import glob,json
          p=glob.glob('out/*.json')[0]; g=json.load(open(p)); assert len(g)==25,(p,len(g))
          print('validated',len(g),p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-ultra-wave-${{ env.WAVE_INDEX }}-${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 14
    env:
      WAVE_INDEX: "0"

  checkpoint1:
    needs: wave1
    if: needs.wave1.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.rank.outputs.decision }}
    steps: &checkpoint_steps
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: sim-v2-ultra-wave-*, path: waves, merge-multiple: true}
      - id: rank
        run: |
          python3 engine-tests/sim_v2_rank.py 'waves/*.json' --baseline P00_F10 \
            --stage confirmation --look "$CHECKPOINT" --max-looks 4 \
            --output checkpoint.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-ultra-checkpoint-${{ env.CHECKPOINT }}
          path: checkpoint.json
          retention-days: 30
    env:
      CHECKPOINT: "1"

  wave2:
    needs: [build, tune, rank, checkpoint1]
    if: needs.checkpoint1.outputs.decision == 'MORE_DATA'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0, 1, 2, 3]
    steps: *wave_steps
    env:
      WAVE_INDEX: "1"

  checkpoint2:
    needs: wave2
    if: needs.wave2.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.rank.outputs.decision }}
    steps: *checkpoint_steps
    env:
      CHECKPOINT: "2"

  wave3:
    needs: [build, tune, rank, checkpoint2]
    if: needs.checkpoint2.outputs.decision == 'MORE_DATA'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0, 1, 2, 3]
    steps: *wave_steps
    env:
      WAVE_INDEX: "2"

  checkpoint3:
    needs: wave3
    if: needs.wave3.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.rank.outputs.decision }}
    steps: *checkpoint_steps
    env:
      CHECKPOINT: "3"

  wave4:
    needs: [build, tune, rank, checkpoint3]
    if: needs.checkpoint3.outputs.decision == 'MORE_DATA'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0, 1, 2, 3]
    steps: *wave_steps
    env:
      WAVE_INDEX: "3"

  checkpoint4:
    needs: wave4
    if: needs.wave4.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.rank.outputs.decision }}
    steps: *checkpoint_steps
    env:
      CHECKPOINT: "4"

  final:
    needs: [rank, checkpoint1, checkpoint2, checkpoint3, checkpoint4]
    if: always() && needs.rank.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: sim-v2-ultra-screen-ranking, path: final}
      - uses: actions/download-artifact@v4
        if: needs.checkpoint1.result == 'success'
        with: {name: sim-v2-ultra-checkpoint-1, path: c1}
      - uses: actions/download-artifact@v4
        if: needs.checkpoint2.result == 'success'
        with: {name: sim-v2-ultra-checkpoint-2, path: c2}
      - uses: actions/download-artifact@v4
        if: needs.checkpoint3.result == 'success'
        with: {name: sim-v2-ultra-checkpoint-3, path: c3}
      - uses: actions/download-artifact@v4
        if: needs.checkpoint4.result == 'success'
        with: {name: sim-v2-ultra-checkpoint-4, path: c4}
      - name: Select latest adaptive result
        run: |
          if [ -s c4/checkpoint.json ]; then cp c4/checkpoint.json final-result.json
          elif [ -s c3/checkpoint.json ]; then cp c3/checkpoint.json final-result.json
          elif [ -s c2/checkpoint.json ]; then cp c2/checkpoint.json final-result.json
          elif [ -s c1/checkpoint.json ]; then cp c1/checkpoint.json final-result.json
          else cp final/screen-ranking.json final-result.json; fi
          cat final-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: sim-v2-ultra-final
          path: final-result.json
          retention-days: 30
