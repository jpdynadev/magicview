name: Kinnan 2k mutation search

on:
  push:
    branches:
      - agent/kinnan-2k-search
    paths:
      - .runs/kinnan-2k-search.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(250))))')" >> "$GITHUB_OUTPUT"
      - run: python3 engine-tests/generate_2k_mutations.py --count 2000
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-manifest
          path: engine-tests/mutation-2k-manifest.json
          retention-days: 14

  screen:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 engine-tests/generate_2k_mutations.py --count 2000
      - name: Build pinned Manabrew/Forge harness
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
      - name: Screen 8 mutations x 20 paired games
        run: |
          START=$(( ${{ matrix.shard }} * 8 ))
          END=$(( START + 8 ))
          for IDX in $(seq "$START" $((END - 1))); do
            VARIANT=$(printf 'M2K%04d' "$IDX")
            python3 engine-tests/manabrew_pilot_v90.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --variant "$VARIANT" \
              --seeds $(seq 910000 910019) \
              --seat-offset 0 \
              --max-round 4 \
              --max-prompts 3500 \
              --max-seconds 90 || true
          done
          find engine-tests/results -type f \( -name 'pilot-trace-*' -o -name 'pilot-stderr-*' -o -name 'pilot-errors-*' \) -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.shard }}
          path: engine-tests/results/pilot-summary-M2K*.json
          if-no-files-found: warn
          retention-days: 14

  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y maven
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
      - run: |
          python3 engine-tests/manabrew_pilot_v89.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --variant B0 --seeds $(seq 910000 910019) --seat-offset 0 \
            --max-round 4 --max-prompts 3500 --max-seconds 90 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-m25
          path: engine-tests/results/pilot-summary-B0.json
          retention-days: 14

  rank:
    needs: [screen, control]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      top100: ${{ steps.rank.outputs.top100 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: screen-*
          path: all-screen
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: control-m25
          path: control
      - id: rank
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, glob, json, os
          completed = {'game_over', 'horizon_complete'}
          rows = []
          for path in glob.glob('all-screen/pilot-summary-M2K*.json'):
              games = json.load(open(path))
              if not games: continue
              variant = games[0].get('variant')
              valid = [g for g in games if g.get('status') in completed]
              n = len(valid)
              rows.append({
                  'variant': variant,
                  'valid': n,
                  'errors': len(games)-n,
                  'assembly': sum(bool(g.get('deterministicT4')) for g in valid),
                  'attempt': sum(bool(g.get('certifiedDeterministicAttempt') or g.get('attemptResolved')) for g in valid),
                  'protected': sum(bool(g.get('protectedAttempt')) for g in valid),
              })
          def key(r):
              n=max(r['valid'],1)
              return (r['protected']/n, r['attempt']/n, r['assembly']/n, r['valid'])
          rows.sort(key=key, reverse=True)
          top=[r['variant'] for r in rows[:100]]
          with open('screen-ranking.csv','w',newline='') as f:
              w=csv.DictWriter(f, fieldnames=['variant','valid','errors','assembly','attempt','protected'])
              w.writeheader(); w.writerows(rows)
          json.dump({'variantsFound':len(rows),'top100':top,'rows':rows},open('screen-ranking.json','w'),indent=2)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('top100='+json.dumps(top,separators=(',',':'))+'\n')
          print('variants ranked:', len(rows))
          print('top 10:', top[:10])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: screen-ranking
          path: |
            screen-ranking.csv
            screen-ranking.json
          retention-days: 14

  confirm:
    needs: rank
    if: ${{ always() && needs.rank.outputs.top100 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.top100) }}
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 engine-tests/generate_2k_mutations.py --count 2000
      - name: Build pinned Manabrew/Forge harness
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
      - name: Confirm survivor with 100 new games
        run: |
          BASE=$((920000 + ${{ matrix.shard }} * 100))
          python3 engine-tests/manabrew_pilot_v90.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --variant "${{ matrix.variant }}" \
            --seeds $(seq "$BASE" $((BASE + 99))) \
            --seat-offset $(( ${{ matrix.shard }} * 100 )) \
            --max-round 4 --max-prompts 3500 --max-seconds 90 || true
          find engine-tests/results -type f \( -name 'pilot-trace-*' -o -name 'pilot-stderr-*' -o -name 'pilot-errors-*' \) -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirm-${{ matrix.variant }}-${{ matrix.shard }}
          path: engine-tests/results/pilot-summary-${{ matrix.variant }}.json
          if-no-files-found: warn
          retention-days: 14

  final:
    needs: [rank, confirm]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: confirm-*
          path: all-confirm
      - uses: actions/download-artifact@v4
        with:
          name: screen-ranking
          path: screen-ranking
      - run: python3 engine-tests/generate_2k_mutations.py --count 2000
      - name: Aggregate confirmation and identify winner
        run: |
          python3 - <<'PY'
          import csv, glob, json
          from collections import defaultdict
          completed={'game_over','horizon_complete'}
          by=defaultdict(list)
          for path in glob.glob('all-confirm/**/pilot-summary-M2K*.json',recursive=True):
              for g in json.load(open(path)):
                  by[g.get('variant')].append(g)
          manifest={r['variant']:r for r in json.load(open('engine-tests/mutation-2k-manifest.json'))}
          rows=[]
          for variant,games in by.items():
              valid=[g for g in games if g.get('status') in completed]
              n=len(valid)
              rows.append({
                  'variant':variant,
                  'valid':n,
                  'errors':len(games)-n,
                  'assembly':sum(bool(g.get('deterministicT4')) for g in valid),
                  'attempt':sum(bool(g.get('certifiedDeterministicAttempt') or g.get('attemptResolved')) for g in valid),
                  'protected':sum(bool(g.get('protectedAttempt')) for g in valid),
                  'cuts':' | '.join(manifest.get(variant,{}).get('cuts',[])),
                  'adds':' | '.join(manifest.get(variant,{}).get('adds',[])),
              })
          def key(r):
              n=max(r['valid'],1)
              return (r['protected']/n,r['attempt']/n,r['assembly']/n,r['valid'])
          rows.sort(key=key,reverse=True)
          with open('final-ranking.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['variant','valid','errors','assembly','attempt','protected','cuts','adds'])
              w.writeheader();w.writerows(rows)
          payload={'confirmedVariants':len(rows),'winner':rows[0] if rows else None,'top20':rows[:20],'all':rows}
          json.dump(payload,open('final-ranking.json','w'),indent=2)
          print(json.dumps(payload['winner'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kinnan-2k-final-ranking
          path: |
            final-ranking.csv
            final-ranking.json
          retention-days: 14
