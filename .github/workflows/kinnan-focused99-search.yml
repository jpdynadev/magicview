name: Kinnan focused 99 search

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-2k-search]
    paths: [.runs/kinnan-focused99-search.txt]

concurrency:
  group: kinnan-focused99-search
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned Manabrew/Forge once
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: focused99-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: [B0, F01_T4_EXACT, F02_T4_LIGHT, F03_T4_MIX, F04_T4_ENGINE, F05_T4_UTILITY, F06_SPELL, F07_MYST, F08_CREATURE, F09_ARTIFACT, F10_BLUE, F11_M30, F12_M30_T4, F13_M30_LIGHT, F14_M30_SPELL, F15_M30_ART]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: focused99-runtime
          path: runtime
      - name: Restore runtime and generate decks
        run: |
          mkdir -p /tmp/manabrew
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_focused99_decks.py
      - name: Run 25 paired screen games
        run: |
          python3 engine-tests/manabrew_pilot_focused99.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --variant '${{ matrix.variant }}' \
            --seeds $(seq 950000 950024) \
            --seat-offset '${{ matrix.seat }}' \
            --max-round 4 --max-prompts 3500 --max-seconds 90 || true
          mkdir -p out
          cp engine-tests/results/pilot-summary-${{ matrix.variant }}.json out/${{ matrix.variant }}-seat${{ matrix.seat }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f99-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 7

  rank:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      confirm: ${{ steps.rank.outputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f99-*
          path: all
          merge-multiple: true
      - id: rank
        run: |
          python3 - <<'PY'
          import csv, glob, json, os
          from collections import defaultdict
          completed={'game_over','horizon_complete'}
          by=defaultdict(list)
          for p in glob.glob('all/*.json'):
              try: games=json.load(open(p))
              except Exception: continue
              if games: by[games[0].get('variant','?')].extend(games)
          rows=[]
          for v,games in by.items():
              valid=[g for g in games if g.get('status') in completed]
              n=len(valid)
              rows.append({'variant':v,'valid':n,'errors':len(games)-n,
                'assembly':sum(bool(g.get('deterministicT4')) for g in valid),
                'attempt':sum(bool(g.get('certifiedDeterministicAttempt') or g.get('attemptResolved')) for g in valid),
                'protected':sum(bool(g.get('protectedAttempt')) for g in valid),
                'naturalWins':sum(bool(g.get('naturalWinAfterAttempt')) for g in valid)})
          for r in rows:
              n=max(r['valid'],1); r['assemblyRate']=r['assembly']/n; r['attemptRate']=r['attempt']/n; r['protectedRate']=r['protected']/n
          rows.sort(key=lambda r:(r['protectedRate'],r['attemptRate'],r['assemblyRate'],r['valid']),reverse=True)
          non=[r['variant'] for r in rows if r['variant']!='B0'][:3]
          confirm=['B0']+non
          json.dump({'ranking':rows,'confirm':confirm},open('focused99-screen-ranking.json','w'),indent=2)
          with open('focused99-screen-ranking.csv','w',newline='') as f:
              fields=['variant','valid','errors','assembly','attempt','protected','naturalWins','assemblyRate','attemptRate','protectedRate']; w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('confirm='+json.dumps(confirm,separators=(',',':'))+'\n')
          print(json.dumps(rows,indent=2)); print('CONFIRM',confirm)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: focused99-screen-ranking
          path: focused99-screen-ranking.*
          retention-days: 7

  adversarial:
    needs: [build, rank]
    if: ${{ always() && needs.rank.outputs.confirm != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(needs.rank.outputs.confirm) }}
        pod: [balanced, turbo, midrange, mixed]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: focused99-runtime
          path: runtime
      - run: |
          mkdir -p /tmp/manabrew
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_focused99_decks.py
      - name: Run 25 adversarial games
        env:
          CEDH_POD: ${{ matrix.pod }}
        run: |
          case '${{ matrix.pod }}' in balanced) BASE=960000;; turbo) BASE=961000;; midrange) BASE=962000;; mixed) BASE=963000;; esac
          START=$((BASE + ${{ matrix.seat }} * 25))
          python3 engine-tests/manabrew_pilot_focused99_adv.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --variant '${{ matrix.variant }}' \
            --seeds $(seq "$START" $((START+24))) \
            --seat-offset '${{ matrix.seat }}' \
            --max-round 5 --max-prompts 4500 --max-seconds 120 || true
          mkdir -p out
          cp engine-tests/results/pilot-summary-${{ matrix.variant }}.json out/${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f99adv-${{ matrix.variant }}-${{ matrix.pod }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 10

  final:
    needs: [rank, adversarial]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f99adv-*
          path: adv
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: focused99-screen-ranking
          path: screen
      - name: Aggregate final confirmation
        run: |
          python3 - <<'PY'
          import csv, glob, json, re, os
          from collections import defaultdict
          completed={'game_over','horizon_complete'}; by=defaultdict(list); detail=[]
          for p in glob.glob('adv/*.json'):
              m=re.match(r'(.+)-(balanced|turbo|midrange|mixed)-seat([0-3])\.json$',os.path.basename(p))
              if not m: continue
              v,pod,seat=m.group(1),m.group(2),int(m.group(3)); games=json.load(open(p)); valid=[g for g in games if g.get('status') in completed]
              r={'variant':v,'pod':pod,'seat':seat,'valid':len(valid),'errors':len(games)-len(valid),
                'wins':sum(bool(g.get('kinnanWon') or g.get('naturalWinAfterAttempt')) for g in valid),
                'assembly':sum(bool(g.get('deterministicT4')) for g in valid),
                'attempt':sum(bool(g.get('certifiedDeterministicAttempt') or g.get('attemptResolved')) for g in valid),
                'protected':sum(bool(g.get('protectedAttempt')) for g in valid)}
              detail.append(r); by[v].append(r)
          totals=[]
          for v,rs in by.items():
              n=sum(x['valid'] for x in rs); wins=sum(x['wins'] for x in rs); prot=sum(x['protected'] for x in rs); att=sum(x['attempt'] for x in rs); ass=sum(x['assembly'] for x in rs)
              totals.append({'variant':v,'valid':n,'errors':sum(x['errors'] for x in rs),'wins':wins,'assembly':ass,'attempt':att,'protected':prot,
                'winRate':wins/max(n,1),'assemblyRate':ass/max(n,1),'attemptRate':att/max(n,1),'protectedRate':prot/max(n,1)})
          totals.sort(key=lambda x:(x['winRate'],x['protectedRate'],x['attemptRate'],x['assemblyRate']),reverse=True)
          json.dump({'ranking':totals,'byPodSeat':detail,'screen':json.load(open('screen/focused99-screen-ranking.json'))},open('focused99-final.json','w'),indent=2)
          fields=['variant','valid','errors','wins','assembly','attempt','protected','winRate','assemblyRate','attemptRate','protectedRate']
          with open('focused99-final.csv','w',newline='') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(totals)
          print(json.dumps(totals,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kinnan-focused99-final
          path: focused99-final.*
          retention-days: 14
