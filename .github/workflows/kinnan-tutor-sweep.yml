name: Kinnan tutor sweep
on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-2k-search]
    paths: [.runs/kinnan-tutor-sweep.txt]
permissions:
  contents: read
env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
concurrency:
  group: kinnan-tutor-sweep
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build runtime once
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" manabrew
      - uses: actions/upload-artifact@v4
        with: {name: tutor-sweep-runtime, path: manabrew-runtime.tgz, retention-days: 2}
  play:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        variant: [B0, T2, T4, T6]
        seat: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: tutor-sweep-runtime}
      - name: Restore and generate
        run: |
          tar -C /tmp -xzf manabrew-runtime.tgz
          python3 engine-tests/generate_tutor_sweep_decks.py
      - name: Run paired games
        run: |
          python3 engine-tests/manabrew_pilot_tutor_sweep.py /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar /tmp/manabrew/forge/forge-gui/ --variant "${{ matrix.variant }}" --seeds $(seq 950000 950024) --seat-offset "${{ matrix.seat }}" --max-round 4 --max-prompts 3500 --max-seconds 90 || true
          find engine-tests/results -type f \( -name 'pilot-trace-*' -o -name 'pilot-stderr-*' -o -name 'pilot-errors-*' \) -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutor-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: engine-tests/results/pilot-summary-${{ matrix.variant }}.json
          if-no-files-found: warn
          retention-days: 7
  aggregate:
    needs: play
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'tutor-*-seat*', path: all-results}
      - name: Aggregate
        run: |
          python3 - <<'PY'
          import glob,json
          from collections import defaultdict
          completed={'game_over','horizon_complete'}; by=defaultdict(list)
          for p in glob.glob('all-results/**/pilot-summary-*.json',recursive=True):
            try: games=json.load(open(p))
            except: continue
            for g in games: by[g.get('variant','?')].append(g)
          rows=[]
          for v,games in by.items():
            valid=[g for g in games if g.get('status') in completed]; n=len(valid)
            r={'variant':v,'valid':n,'errors':len(games)-n,'assembly':sum(bool(g.get('deterministicT4')) for g in valid),'attempt':sum(bool(g.get('certifiedDeterministicAttempt') or g.get('attemptResolved')) for g in valid),'protected':sum(bool(g.get('protectedAttempt')) for g in valid),'naturalWins':sum(bool(g.get('naturalWinAfterAttempt')) for g in valid)}
            for x in ['assembly','attempt','protected']: r[x+'Rate']=r[x]/n if n else 0
            rows.append(r)
          rows.sort(key=lambda r:(r['protectedRate'],r['attemptRate'],r['assemblyRate']),reverse=True)
          json.dump({'rows':rows,'winner':rows[0] if rows else None},open('tutor-sweep-results.json','w'),indent=2); print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: kinnan-tutor-sweep-results, path: tutor-sweep-results.json, retention-days: 7}
