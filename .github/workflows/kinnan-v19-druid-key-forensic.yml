name: Kinnan v19 Druid key forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v19-druid-key-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-repair-forensic
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v19-druid-key-forensic

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: Replay persistent timeout key with forensic capture
        run: |
          set -euo pipefail
          mkdir -p out
          for TRY in 1 2; do
            CACHE=".sim-cache/druid-key-forensic-${GITHUB_RUN_ID}-try${TRY}"
            ENGINE="$MANABREW_REF:arch-v19-druid-key-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:try${TRY}"
            CEDH_POD=turbo python3 engine-tests/sim_v2_worker_arch.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --mode adversarial --variant DRUID_TUTOR --fixed-seat 0 --seeds 2700397 \
              --max-round 4 --max-prompts 7000 --max-seconds 320 --jvm-reuse 1 \
              --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures \
              --engine-id "$ENGINE" \
              --exposure-card 'Energy Refractor' --exposure-card 'Dispel' \
              --exposure-card 'Springleaf Drum' --exposure-card 'Hydroelectric Specimen' \
              --exposure-card "Green Sun's Zenith" --exposure-card 'Eldritch Evolution' \
              --exposure-card 'Devoted Druid' --exposure-card "Machine God's Effigy" \
              --output "out/try${TRY}.json" > "out/try${TRY}.log" 2>&1 || true
          done
          python3 - <<'PY'
          import json, pathlib
          rows=[]
          for i in (1,2):
              p=pathlib.Path(f'out/try{i}.json')
              try:
                  d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
              except Exception as e:
                  r={'status':'missing','error':repr(e)}
              rows.append({'try':i,'status':r.get('status'),'wallMs':r.get('wallMs'),'prompts':r.get('prompts'),'primaryFailureCode':r.get('primaryFailureCode'),'cleanup':r.get('v2SessionCleanup'),'cleanupError':r.get('v2SessionCleanupError'),'pilotVersion':r.get('pilotVersion'),'seed':r.get('seed'),'seat':r.get('kinnanSeat'),'pod':r.get('podProfile')})
          pathlib.Path('out/summary.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: druid-key-forensic
          path: |
            out/**
            engine-tests/results/**
          if-no-files-found: warn
          retention-days: 14
