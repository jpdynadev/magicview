name: Kinnan v110 shared-key canonical revalidation

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v110-shared-key-revalidation.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-high-value-confirmation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v110-shared-key-revalidation

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          for key in ('F10','F10_TUTOR_PAIR'):
              p=Path('engine-tests/decks')/f'Kinnan_ARCH_{key}.dck'
              lines=p.read_text().splitlines(); start=lines.index('[Main]')+1
              cards=[x.split(' ',1)[1] for x in lines[start:] if x.strip()]
              assert len(cards)==99 and len(set(cards))==99,(key,len(cards),len(set(cards)))
          adv=Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          assert "runner.PILOT_VERSION = 'arch-aware-v1.10-adversarial'" in adv
          assert 'Mockingbird' in adv and '_MOCKINGBIRD_BOOLEAN_STATES' in adv
          PY
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-v110-revalidation.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: v110-revalidation-runtime
          path: manabrew-v110-revalidation.tgz
          compression-level: 0
          retention-days: 2

  replay:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [F10, F10_TUTOR_PAIR]
        repetition: [1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: v110-revalidation-runtime, path: runtime}
      - name: Replay pathological canonical key
        env:
          VARIANT: ${{ matrix.variant }}
          REP: ${{ matrix.repetition }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-v110-revalidation.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          SEED=3020454
          SEAT=2
          POD=midrange
          ATT="out/${VARIANT}-rep${REP}.json"
          CACHE=".sim-cache/v110-revalidation-${GITHUB_RUN_ID}-${VARIANT}-${SEED}-s${SEAT}-${POD}-rep${REP}"
          ENGINE="$MANABREW_REF:arch-v110-revalidation:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:rep${REP}"
          CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" \
            --max-round 4 --max-prompts 5000 --max-seconds 160 --jvm-reuse 1 \
            --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures \
            --engine-id "$ENGINE" --output "$ATT"
          python3 - "$ATT" "$VARIANT" <<'PY'
          import json,sys
          p,v=sys.argv[1:]
          d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
          assert r.get('status') in {'game_over','horizon_complete'}, r.get('status')
          assert r.get('variant')==v
          assert int(r.get('seed'))==3020454
          assert int(r.get('kinnanSeat'))==2
          assert r.get('podProfile')=='midrange'
          assert r.get('pilotVersion')=='arch-aware-v1.10-adversarial'
          print(json.dumps({k:r.get(k) for k in ('status','variant','seed','kinnanSeat','podProfile','pilotVersion','firstAssemblyTurn','firstAttemptTurn','strictProtectedT4','kinnanWon','primaryFailureCode')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v110-revalidation-${{ matrix.variant }}-rep${{ matrix.repetition }}
          path: out/**
          if-no-files-found: error
          retention-days: 7
