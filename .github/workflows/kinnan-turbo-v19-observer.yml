name: Kinnan Turbo v19 observer

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-turbo-v19-observer.txt]

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - name: Capture latest strict v19 Turbo screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p status
          RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=agent%2Fkinnan-expanded-architecture&per_page=100" --jq '[.workflow_runs[] | select(.name=="Kinnan Turbo F10 v19 paired 200 screen")][0]')
          if [ -z "$RUN" ] || [ "$RUN" = null ]; then
            jq -n '{found:false,checkedAt:(now|todateiso8601)}' > status/kinnan-turbo-v19-progress.json
          else
            ID=$(jq -r '.id' <<<"$RUN")
            JOBS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ID/jobs?per_page=100")
            ARTS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts?per_page=100")
            jq -n --argjson run "$RUN" --argjson jobs "$JOBS" --argjson arts "$ARTS" '{found:true,checkedAt:(now|todateiso8601),runId:$run.id,runNumber:$run.run_number,status:$run.status,conclusion:$run.conclusion,headSha:$run.head_sha,htmlUrl:$run.html_url,jobs:[$jobs.jobs[]|{id,name,status,conclusion}],artifacts:[$arts.artifacts[]|{id,name,size_in_bytes,expired}]}' > status/kinnan-turbo-v19-progress.json
          fi
          cat status/kinnan-turbo-v19-progress.json
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/kinnan-turbo-v19-progress.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Turbo v19 screen progress [skip ci]'
          git push origin HEAD:agent/kinnan-expanded-architecture
