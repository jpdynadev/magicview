name: Kinnan v110 GSZ baseline timeout forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v110-gsz-baseline-timeout-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-high-value-confirmation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v110-gsz-baseline-timeout-forensic
  SIM_V2_FORENSIC_DIR: out

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        xmx: [1280, 2048]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          adv=Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          assert 'arch-aware-v1.10-adversarial' in adv
          PY
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: Replay persistent F10 timeout with diagnostics
        env:
          XMX: ${{ matrix.xmx }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/F10-xmx${XMX}-rep${REP}-seed3320350-seat2-midrange.json"
          LOG="out/F10-xmx${XMX}-rep${REP}-seed3320350-seat2-midrange.log"
          TIMELOG="out/F10-xmx${XMX}-rep${REP}-time.txt"
          GCLOG="$GITHUB_WORKSPACE/out/F10-xmx${XMX}-rep${REP}-gc.log"
          HSERR="$GITHUB_WORKSPACE/out/F10-xmx${XMX}-rep${REP}-hs_err_pid%p.log"
          CACHE=".sim-cache/gsz-baseline-forensic-${GITHUB_RUN_ID}-xmx${XMX}-rep${REP}"
          ENGINE="$MANABREW_REF:arch-v110-gsz-baseline-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:xmx${XMX}:rep${REP}"
          rm -f out/forensic-crash-diagnostics.json out/forge-stderr-*.log
          export JAVA_TOOL_OPTIONS="-XX:ErrorFile=${HSERR} -Xlog:gc*,safepoint:file=${GCLOG}:time,uptime,level,tags"
          set +e
          CEDH_POD=midrange /usr/bin/time -v -o "$TIMELOG" \
            python3 engine-tests/sim_v2_forensic_driver.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --mode adversarial --variant F10 --fixed-seat 2 --seeds 3320350 \
              --max-round 4 --max-prompts 7000 --max-seconds 320 --jvm-reuse 1 \
              --xmx "${XMX}m" --xms 192m --cache-dir "$CACHE" --retain-traces all \
              --engine-id "$ENGINE" \
              --exposure-card 'Energy Refractor' --exposure-card "Green Sun's Zenith" \
              --output "$OUT" > "$LOG" 2>&1
          RC=$?
          set -e
          echo "xmx=$XMX rep=$REP rc=$RC" | tee out/summary.txt
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) and d else d; print(json.dumps({k:r.get(k) for k in ["status","variant","seed","kinnanSeat","podProfile","pilotVersion","firstAssemblyTurn","firstAttemptTurn","strictProtectedT4","kinnanWon","primaryFailureCode","prompts","wallMs","error"]},sort_keys=True))' "$OUT" 2>&1 | tee -a out/summary.txt || true
          if [ -f out/forensic-crash-diagnostics.json ]; then cp out/forensic-crash-diagnostics.json "out/F10-xmx${XMX}-rep${REP}-forensic-crash-diagnostics.json"; fi
          for f in out/forge-stderr-*.log; do [ -e "$f" ] || continue; cp "$f" "out/F10-xmx${XMX}-rep${REP}-$(basename "$f")"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsz-baseline-timeout-forensic-xmx${{ matrix.xmx }}-rep${{ matrix.rep }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
