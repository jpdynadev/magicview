name: Kinnan v19 Tutor Pair shared-key forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v19-tutor-pair-shared-key-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-high-value-confirmation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v19-tutor-pair-shared-key-forensic

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [F10, F10_TUTOR_PAIR]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: Replay shared pathological key with full diagnostics
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p out
          for TRY in 1 2; do
            OUT="out/${VARIANT}-seed3020454-seat2-midrange-try${TRY}.json"
            LOG="out/${VARIANT}-seed3020454-seat2-midrange-try${TRY}.log"
            CACHE=".sim-cache/tutorpair-forensic-${GITHUB_RUN_ID}-${VARIANT}-try${TRY}"
            ENGINE="$MANABREW_REF:arch-v19-tutorpair-shared-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:${VARIANT}:try${TRY}"
            set +e
            CEDH_POD=midrange python3 engine-tests/sim_v2_worker_arch.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --mode adversarial --variant "$VARIANT" --fixed-seat 2 --seeds 3020454 \
              --max-round 4 --max-prompts 7000 --max-seconds 320 --jvm-reuse 1 \
              --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces all \
              --engine-id "$ENGINE" \
              --exposure-card 'Energy Refractor' --exposure-card 'Hydroelectric Specimen' \
              --exposure-card "Green Sun's Zenith" --exposure-card 'Eldritch Evolution' \
              --output "$OUT" > "$LOG" 2>&1
            RC=$?
            set -e
            echo "try=$TRY rc=$RC" | tee -a out/summary.txt
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) and d else d; print(json.dumps({k:r.get(k) for k in ["status","variant","seed","kinnanSeat","podProfile","pilotVersion","firstAssemblyTurn","firstAttemptTurn","strictProtectedT4","kinnanWon","primaryFailureCode","promptCount","elapsedSeconds"]},sort_keys=True))' "$OUT" 2>&1 | tee -a out/summary.txt || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutor-pair-shared-key-forensic-${{ matrix.variant }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
