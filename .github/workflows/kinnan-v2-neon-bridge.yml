name: Kinnan v2 Neon bridge capture

on:
  workflow_dispatch:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v2-neon-bridge.txt]

# This intentionally shares the architecture concurrency group: pipeline
# reproduction supersedes an older architecture attempt rather than competing
# for Forge compute.
concurrency:
  group: kinnan-expanded-architecture
  cancel-in-progress: true

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: engine-tests
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-v2-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build pinned runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 2

  reproduce:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: [F10, COPY_CORE, COPY_CREATURE, DRUID_EFFIGY, COPY_DRUID, COPY_HEAVY, COPY_ARTIFACT, COPY_PROTECTED, DRUID_TUTOR, TUTOR_DENSE, NODE_DENSE, COPY_VALUE]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: bridge-runtime, path: runtime}
      - name: Restore runtime and generate decks
        run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 -m py_compile engine-tests/manabrew_pilot_arch.py engine-tests/sim_v2_worker_arch.py engine-tests/sim_v2_worker.py
      - id: shard-cache
        uses: actions/cache@v4
        with:
          path: .sim-cache/architecture-v2
          key: arch-v2-screen-${{ matrix.variant }}-s${{ matrix.seat }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/generate_architecture_decks_v2.py','engine-tests/manabrew_pilot_arch.py','engine-tests/sim_v2_worker_arch.py','engine-tests/sim_v2_worker.py','engine-tests/manabrew_pilot_v8.py','engine-tests/kinnan_policy_v8.py') }}
      - name: Reproduce 10 canonical cold-v2 games
        env:
          VARIANT: ${{ matrix.variant }}
          SEAT: ${{ matrix.seat }}
        run: |
          START=$((1800000 + SEAT * 50))
          mapfile -t EXPOSURES < <(python3 - <<'PY'
          import os
          from generate_architecture_decks_v2 import SPECS
          for card in SPECS[os.environ['VARIANT']][1]: print(card)
          PY
          )
          ARGS=()
          for card in "${EXPOSURES[@]}"; do ARGS+=(--exposure-card "$card"); done
          python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant "$VARIANT" --fixed-seat "$SEAT" \
            --seeds $(seq "$START" $((START+9))) \
            --max-round 4 --max-prompts 3500 --max-seconds 100 \
            --jvm-reuse 1 --xmx 1280m --xms 192m \
            --cache-dir .sim-cache/architecture-v2 --retain-traces none \
            --engine-id "$MANABREW_REF:arch-cold-v1" \
            "${ARGS[@]}" --output "out/${VARIANT}-seat${SEAT}.json" \
            | tee "out/${VARIANT}-seat${SEAT}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  export:
    needs: reproduce
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: all
          merge-multiple: true
      - name: Validate and build durable export
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          from collections import defaultdict
          completed={'game_over','horizon_complete'}
          variants=['F10','COPY_CORE','COPY_CREATURE','DRUID_EFFIGY','COPY_DRUID','COPY_HEAVY','COPY_ARTIFACT','COPY_PROTECTED','DRUID_TUTOR','TUTOR_DENSE','NODE_DENSE','COPY_VALUE']
          by=defaultdict(dict)
          raw_count=0
          for p in glob.glob('all/*.json'):
              try: games=json.load(open(p))
              except Exception: continue
              if not isinstance(games,list): continue
              for g in games:
                  raw_count += 1
                  v=g.get('variant')
                  if v not in variants: continue
                  key=(int(g.get('seed')),int(g.get('kinnanSeat')))
                  by[v][key]=g
          root='engine-tests/v2-export/bridge/latest'
          os.makedirs(root,exist_ok=True)
          manifest={'runId':int(os.environ['RUN_ID']),'runAttempt':int(os.environ['RUN_ATTEMPT']),'commitSha':os.environ['COMMIT_SHA'],'expectedPerVariant':40,'expectedTotal':480,'rawRecords':raw_count,'variants':{},'complete':True}
          for v in variants:
              games=[by[v][k] for k in sorted(by[v])]
              valid=sum(g.get('status') in completed for g in games)
              strict=sum(bool(g.get('strictProtectedT4')) for g in games if g.get('status') in completed)
              exposed=sum(bool(g.get('slotExposed')) for g in games if g.get('status') in completed)
              manifest['variants'][v]={'records':len(games),'valid':valid,'strictProtectedT4':strict,'exposed':exposed}
              if len(games)!=40 or valid!=40:
                  manifest['complete']=False
              with open(f'{root}/{v}.json','w') as f: json.dump(games,f,separators=(',',':'))
          with open(f'{root}/manifest.json','w') as f: json.dump(manifest,f,indent=2)
          print(json.dumps(manifest,indent=2))
          if not manifest['complete']:
              raise SystemExit('bridge export incomplete; refusing to call pipeline reproduced')
          PY
      - name: Commit validated v2 corpus to branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine-tests/v2-export/bridge/latest
          git commit -m "record validated v2 bridge corpus run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:agent/kinnan-expanded-architecture
