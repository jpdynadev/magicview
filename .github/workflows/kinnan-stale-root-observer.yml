name: Kinnan stale root observer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.runs/kinnan-stale-root-observer.txt]

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture forensic run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p status
          RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=agent/kinnan-expanded-architecture&per_page=50" \
            --jq '[.workflow_runs[] | select(.name=="Kinnan stale root-cause forensic")][0]')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            jq -n '{found:false,checkedAt:(now|todateiso8601)}' > status/kinnan-stale-root-cause-progress.json
          else
            ID=$(jq -r '.id' <<<"$RUN")
            JOBS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ID/jobs?per_page=100")
            ARTS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts?per_page=100")
            jq -n --argjson run "$RUN" --argjson jobs "$JOBS" --argjson arts "$ARTS" '{
              found:true,checkedAt:(now|todateiso8601),runId:$run.id,headSha:$run.head_sha,status:$run.status,conclusion:$run.conclusion,
              jobs:[$jobs.jobs[]|{id,name,status,conclusion}],artifacts:[$arts.artifacts[]|{id,name,size_in_bytes}]
            }' > status/kinnan-stale-root-cause-progress.json
          fi
          cat status/kinnan-stale-root-cause-progress.json
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/kinnan-stale-root-cause-progress.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record stale root-cause progress [skip ci]'
          git push
