name: Kinnan v19 broad architecture screen

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v19-broad-screen.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-broad-screen
  cancel-in-progress: false

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'
  SIM_V2_CAPTURE_STDERR: '0'
  SIM_V2_PROFILE: arch-repaired-v19-broad-200-set2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
      - name: Build exact repaired runtime and decks
        run: |
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          for key in ('F10','TUTOR_DENSE','DRUID_TUTOR','NODE_DENSE'):
              p=Path('engine-tests/decks')/f'Kinnan_ARCH_{key}.dck'
              lines=p.read_text().splitlines(); start=lines.index('[Main]')+1
              cards=[x.split(' ',1)[1] for x in lines[start:] if x.strip()]
              assert len(cards)==99 and len(set(cards))==99,(key,len(cards),len(set(cards)))
          adv=Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          assert 'arch-aware-v1.9-adversarial' in adv
          PY
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-v19-broad.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: broad-v19-runtime
          path: manabrew-v19-broad.tgz
          compression-level: 0
          retention-days: 2

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        variant: [F10, TUTOR_DENSE, DRUID_TUTOR, NODE_DENSE]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: broad-v19-runtime, path: runtime}
      - name: Run 50 strict canonical paired keys
        env:
          VARIANT: ${{ matrix.variant }}
          SEAT: ${{ matrix.seat }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out/valid out/attempts
          tar -C /tmp/manabrew -xzf runtime/manabrew-v19-broad.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          EXP_ARGS=(
            --exposure-card 'Energy Refractor'
            --exposure-card 'Dispel'
            --exposure-card 'Springleaf Drum'
            --exposure-card 'Hydroelectric Specimen'
            --exposure-card "Nature's Rhythm"
            --exposure-card 'Misdirection'
            --exposure-card "Green Sun's Zenith"
            --exposure-card 'Eldritch Evolution'
            --exposure-card 'Tribute Mage'
            --exposure-card 'Devoted Druid'
            --exposure-card "Machine God's Effigy"
            --exposure-card 'Copy Artifact'
            --exposure-card 'Flesh Duplicate'
          )
          BASE=$((2500000 + SEAT * 100))
          : > "out/${VARIANT}-seat${SEAT}-errors.ndjson"
          for OFFSET in $(seq 0 49); do
            SEED=$((BASE + OFFSET))
            case $((OFFSET % 4)) in
              0) POD=balanced ;;
              1) POD=turbo ;;
              2) POD=midrange ;;
              3) POD=mixed ;;
            esac
            OK=0
            for TRY in 1 2 3; do
              ATT="out/attempts/${VARIANT}-s${SEAT}-seed${SEED}-${POD}-try${TRY}.json"
              CACHE=".sim-cache/broad-v19-set2-${GITHUB_RUN_ID}-${VARIANT}-s${SEAT}-${SEED}-${POD}-try${TRY}"
              ENGINE="$MANABREW_REF:arch-v19-broad-set2:${GITHUB_RUN_ID}:${GITHUB_SHA}:try${TRY}"
              set +e
              CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py \
                /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
                /tmp/manabrew/forge/forge-gui/ \
                --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" \
                --max-round 4 --max-prompts 5000 --max-seconds 160 --jvm-reuse 1 \
                --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures \
                --engine-id "$ENGINE" "${EXP_ARGS[@]}" --output "$ATT" \
                > "out/attempts/${VARIANT}-s${SEAT}-seed${SEED}-${POD}-try${TRY}.log" 2>&1
              RC=$?
              set -e
              STATUS=$(python3 - "$ATT" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1])); r=d[0] if isinstance(d,list) and d else d
              print(r.get('status','missing') if isinstance(r,dict) else 'missing')
          except Exception: print('missing')
          PY
              )
              if [ "$STATUS" = game_over ] || [ "$STATUS" = horizon_complete ]; then
                python3 - "$ATT" "$VARIANT" "$SEAT" "$SEED" "$POD" <<'PY'
          import json,sys
          p,v,seat,seed,pod=sys.argv[1:]
          d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
          assert r.get('variant')==v
          assert int(r.get('kinnanSeat'))==int(seat)
          assert int(r.get('seed'))==int(seed)
          assert r.get('podProfile')==pod
          assert r.get('pilotVersion')=='arch-aware-v1.9-adversarial'
          PY
                cp "$ATT" "out/valid/${VARIANT}-s${SEAT}-seed${SEED}.json"
                OK=1; break
              fi
              printf '{"variant":"%s","seat":%s,"seed":%s,"pod":"%s","try":%s,"status":"%s","rc":%s}\n' "$VARIANT" "$SEAT" "$SEED" "$POD" "$TRY" "$STATUS" "$RC" >> "out/${VARIANT}-seat${SEAT}-errors.ndjson"
            done
            [ "$OK" -eq 1 ] || echo "UNRESOLVED $VARIANT $SEAT $SEED $POD" >&2
          done
          python3 - "$VARIANT" "$SEAT" <<'PY'
          import glob,json,sys
          v=sys.argv[1]; seat=int(sys.argv[2]); rows=[]
          for p in glob.glob(f'out/valid/{v}-s{seat}-seed*.json'):
              d=json.load(open(p)); rows.append(d[0] if isinstance(d,list) else d)
          keys={(int(r['seed']),int(r['kinnanSeat']),r.get('podProfile')) for r in rows if r.get('status') in {'game_over','horizon_complete'}}
          assert len(rows)==50 and len(keys)==50,(v,seat,len(rows),len(keys))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-v19-set2-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/**
          if-no-files-found: error
          retention-days: 10

  aggregate:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - uses: actions/download-artifact@v4
        with: {pattern: broad-v19-set2-*, path: all}
      - name: Strict paired analysis
        run: |
          python3 - <<'PY'
          import collections,glob,json,math,pathlib
          variants=['F10','TUTOR_DENSE','DRUID_TUTOR','NODE_DENSE']; valid_status={'game_over','horizon_complete'}
          rows={v:[] for v in variants}
          for p in glob.glob('all/**/valid/*.json',recursive=True):
              d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
              if r.get('variant') in rows: rows[r['variant']].append(r)
          def key(r): return (int(r['seed']),int(r['kinnanSeat']),str(r.get('podProfile')))
          def met(r,m):
              if m=='assemblyT4': return (r.get('firstAssemblyTurn') or 99)<=4
              if m=='attemptT4': return (r.get('firstAttemptTurn') or 99)<=4
              return bool(r.get(m))
          maps={v:{key(r):r for r in rr if r.get('status') in valid_status} for v,rr in rows.items()}
          base=maps['F10']; report={'profile':'arch-repaired-v19-broad-200-set2','strictValid':False,'variants':{},'paired':{}}
          for v in variants:
              good=list(maps[v].values()); st={'records':len(rows[v]),'valid':len(good),'uniqueKeys':len(maps[v]),
                'statuses':dict(collections.Counter(str(r.get('status')) for r in rows[v])),
                'pilotVersions':sorted(set(str(r.get('pilotVersion')) for r in good)),
                'deckHashes':sorted(set(str(r.get('variantDeckSha256')) for r in good)),
                'assemblyT4':sum(met(r,'assemblyT4') for r in good),'attemptT4':sum(met(r,'attemptT4') for r in good),
                'protectedT4':sum(met(r,'strictProtectedT4') for r in good),'wins':sum(met(r,'kinnanWon') for r in good),
                'mulligans':sum(int(r.get('mulligans') or 0) for r in good),
                'failureCodes':dict(collections.Counter(str(r.get('primaryFailureCode') or 'NONE') for r in good)),
                'pods':{},'seats':{}}
              for pod in ('balanced','turbo','midrange','mixed'):
                  x=[r for r in good if r.get('podProfile')==pod]; st['pods'][pod]={'n':len(x),'assemblyT4':sum(met(r,'assemblyT4') for r in x),'attemptT4':sum(met(r,'attemptT4') for r in x),'protectedT4':sum(met(r,'strictProtectedT4') for r in x),'wins':sum(met(r,'kinnanWon') for r in x)}
              for s in range(4):
                  x=[r for r in good if int(r.get('kinnanSeat',-1))==s]; st['seats'][str(s)]={'n':len(x),'assemblyT4':sum(met(r,'assemblyT4') for r in x),'attemptT4':sum(met(r,'attemptT4') for r in x),'protectedT4':sum(met(r,'strictProtectedT4') for r in x),'wins':sum(met(r,'kinnanWon') for r in x)}
              report['variants'][v]=st
              if v!='F10':
                  common=sorted(set(base)&set(maps[v]))
                  def mc(m):
                      a=sum(met(maps[v][k],m) and not met(base[k],m) for k in common); c=sum(met(base[k],m) and not met(maps[v][k],m) for k in common); n=a+c
                      p=1.0 if not n else min(1.0,2*sum(math.comb(n,i) for i in range(min(a,c)+1))/(2**n))
                      return {'candidateOnly':a,'baselineOnly':c,'discordant':n,'pTwoSided':p}
                  report['paired'][v]={}
                  for m in ('assemblyT4','attemptT4','strictProtectedT4','kinnanWon'):
                      cv=sum(met(maps[v][k],m) for k in common); bv=sum(met(base[k],m) for k in common)
                      report['paired'][v][m]={'keys':len(common),'candidate':cv,'baseline':bv,'deltaRate':(cv-bv)/len(common) if common else None,'mcnemar':mc(m)}
          report['strictValid']=(all(report['variants'][v]['records']==200 and report['variants'][v]['valid']==200 and report['variants'][v]['uniqueKeys']==200 and report['variants'][v]['pilotVersions']==['arch-aware-v1.9-adversarial'] for v in variants) and all(set(maps[v])==set(base) for v in variants))
          out=pathlib.Path('results/kinnan-v19-broad-200-set2-latest.json'); out.parent.mkdir(exist_ok=True); out.write_text(json.dumps(report,indent=2,sort_keys=True)); print(json.dumps(report,indent=2,sort_keys=True))
          if not report['strictValid']: raise SystemExit('STRICT_PAIRING_FAILED')
          PY
      - name: Commit report
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/kinnan-v19-broad-200-set2-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Kinnan v19 broad 200 set2 [skip ci]'
          git push origin HEAD:agent/kinnan-expanded-architecture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-v19-set2-report
          path: results/kinnan-v19-broad-200-set2-latest.json
          if-no-files-found: warn
          retention-days: 14
