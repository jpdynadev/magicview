name: Kinnan v2 proof corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.runs/kinnan-v2-proof-corpus.txt]

permissions:
  contents: write

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: engine-tests
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: runtime-cache
        uses: actions/cache@v4
        with:
          path: manabrew-runtime.tgz
          key: manabrew-runtime-v2-${{ runner.os }}-${{ env.MANABREW_REF }}-${{ hashFiles('engine-tests/patches/manabrew-card-name-runaway.patch') }}
      - name: Build pinned runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/engine-tests/patches/manabrew-card-name-runaway.patch"
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-runtime.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: proof-runtime
          path: manabrew-runtime.tgz
          compression-level: 0
          retention-days: 1

  game:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: [F10, COPY_CORE, COPY_CREATURE, DRUID_EFFIGY, COPY_DRUID, COPY_HEAVY, COPY_ARTIFACT, COPY_PROTECTED, DRUID_TUTOR, TUTOR_DENSE, NODE_DENSE, COPY_VALUE]
        seat: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/kinnan-expanded-architecture}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: proof-runtime, path: runtime}
      - run: |
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-runtime.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
      - name: Run one canonical cold-v2 game
        env:
          VARIANT: ${{ matrix.variant }}
          SEAT: ${{ matrix.seat }}
        run: |
          SEED=$((1800000 + SEAT * 50))
          mapfile -t EXPOSURES < <(python3 - <<'PY'
          import os
          from generate_architecture_decks_v2 import SPECS
          for card in SPECS[os.environ['VARIANT']][1]: print(card)
          PY
          )
          ARGS=(); for card in "${EXPOSURES[@]}"; do ARGS+=(--exposure-card "$card"); done
          python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode screen --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" \
            --max-round 4 --max-prompts 3500 --max-seconds 100 \
            --jvm-reuse 1 --xmx 1280m --xms 192m --cache-dir .sim-cache/proof \
            --retain-traces none --engine-id "$MANABREW_REF:arch-cold-v1" \
            "${ARGS[@]}" --output "out/${VARIANT}-seat${SEAT}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ matrix.variant }}-seat${{ matrix.seat }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: game
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kinnan-expanded-architecture
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-*
          path: all
          merge-multiple: true
      - name: Validate all 48 records
        run: |
          python3 - <<'PY'
          import glob,json,os
          games=[]
          for p in glob.glob('all/*.json'):
              x=json.load(open(p))
              if isinstance(x,list): games += x
          keyed={(g.get('variant'),g.get('kinnanSeat'),g.get('seed')):g for g in games}
          games=[keyed[k] for k in sorted(keyed,key=str)]
          root='engine-tests/v2-export/proof/latest'; os.makedirs(root,exist_ok=True)
          valid=sum(g.get('status') in {'game_over','horizon_complete'} for g in games)
          manifest={'records':len(games),'valid':valid,'errors':len(games)-valid,'expected':48,'complete':len(games)==48}
          json.dump(games,open(f'{root}/games.json','w'),separators=(',',':'))
          json.dump(manifest,open(f'{root}/manifest.json','w'),indent=2)
          print(json.dumps(manifest,indent=2))
          if len(games)!=48: raise SystemExit('proof corpus missing records')
          PY
      - name: Commit proof corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine-tests/v2-export/proof/latest
          git commit -m 'record 48-game fresh v2 proof corpus [skip ci]'
          git pull --rebase origin agent/kinnan-expanded-architecture
          git push origin HEAD:agent/kinnan-expanded-architecture
