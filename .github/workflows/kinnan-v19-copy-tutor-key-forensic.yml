name: Kinnan v19 Copy Tutor key forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v19-copy-tutor-key-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-repair-forensic
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v19-copy-tutor-key-forensic

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - seat: 0
            seed: 2800160
            pod: balanced
          - seat: 2
            seed: 2820348
            pod: balanced
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build repaired runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: Replay persistent timeout key with forensic capture
        env:
          SEAT: ${{ matrix.seat }}
          SEED: ${{ matrix.seed }}
          POD: ${{ matrix.pod }}
        run: |
          set -euo pipefail
          mkdir -p out
          for TRY in 1 2; do
            CACHE=".sim-cache/copy-tutor-key-forensic-${GITHUB_RUN_ID}-s${SEAT}-${SEED}-try${TRY}"
            ENGINE="$MANABREW_REF:arch-v19-copy-tutor-key-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:s${SEAT}:${SEED}:try${TRY}"
            CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --mode adversarial --variant F10_COPY_TUTOR --fixed-seat "$SEAT" --seeds "$SEED" \
              --max-round 4 --max-prompts 7000 --max-seconds 320 --jvm-reuse 1 \
              --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces failures \
              --engine-id "$ENGINE" \
              --exposure-card 'Reshape' --exposure-card 'Spellseeker' \
              --exposure-card 'Energy Refractor' --exposure-card 'Hydroelectric Specimen' \
              --exposure-card 'Clever Impersonator' --exposure-card 'Flesh Duplicate' \
              --exposure-card "Green Sun's Zenith" --exposure-card 'Eldritch Evolution' \
              --output "out/try${TRY}.json" > "out/try${TRY}.log" 2>&1 || true
          done
          python3 - <<'PY'
          import json, pathlib
          rows=[]
          for i in (1,2):
              p=pathlib.Path(f'out/try{i}.json')
              try:
                  d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
              except Exception as e:
                  r={'status':'missing','error':repr(e)}
              rows.append({'try':i,'status':r.get('status'),'wallMs':r.get('wallMs'),'prompts':r.get('prompts'),'primaryFailureCode':r.get('primaryFailureCode'),'firstAssemblyTurn':r.get('firstAssemblyTurn'),'firstAttemptTurn':r.get('firstAttemptTurn'),'strictProtectedT4':r.get('strictProtectedT4'),'kinnanWon':r.get('kinnanWon'),'exposureCards':r.get('exposureCards'),'cleanup':r.get('v2SessionCleanup'),'cleanupError':r.get('v2SessionCleanupError'),'pilotVersion':r.get('pilotVersion'),'seed':r.get('seed'),'seat':r.get('kinnanSeat'),'pod':r.get('podProfile')})
          pathlib.Path('out/summary.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-tutor-key-forensic-s${{ matrix.seat }}-seed${{ matrix.seed }}
          path: |
            out/**
            engine-tests/results/**
          if-no-files-found: warn
          retention-days: 14
