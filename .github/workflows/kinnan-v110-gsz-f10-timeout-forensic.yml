name: Kinnan v110 GSZ baseline timeout forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v110-gsz-f10-timeout-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-high-value-confirmation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v110-gsz-f10-timeout-forensic

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine-tests/decks/Kinnan_ARCH_F10.dck')
          lines=p.read_text().splitlines(); start=lines.index('[Main]')+1
          cards=[x.split(' ',1)[1] for x in lines[start:] if x.strip()]
          assert len(cards)==99 and len(set(cards))==99
          adv=Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          assert "runner.PILOT_VERSION = 'arch-aware-v1.10-adversarial'" in adv
          PY
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
          tar -C /tmp/manabrew -czf "$GITHUB_WORKSPACE/manabrew-v110-gsz-timeout-forensic.tgz" forge-harness/target/forge-harness-jar-with-dependencies.jar forge/forge-gui
      - uses: actions/upload-artifact@v4
        with:
          name: v110-gsz-timeout-forensic-runtime
          path: manabrew-v110-gsz-timeout-forensic.tgz
          compression-level: 0
          retention-days: 2

  replay:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        repetition: [1,2]
        heap: [1280m,2048m]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: v110-gsz-timeout-forensic-runtime, path: runtime}
      - name: Replay persistent F10 timeout key
        env:
          REP: ${{ matrix.repetition }}
          HEAP: ${{ matrix.heap }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manabrew out
          tar -C /tmp/manabrew -xzf runtime/manabrew-v110-gsz-timeout-forensic.tgz
          python3 engine-tests/generate_architecture_decks_v2.py
          SEED=3320350
          SEAT=2
          POD=midrange
          VARIANT=F10
          ATT="out/${VARIANT}-${HEAP}-rep${REP}.json"
          CACHE=".sim-cache/v110-gsz-timeout-forensic-${GITHUB_RUN_ID}-${VARIANT}-${SEED}-s${SEAT}-${POD}-${HEAP}-rep${REP}"
          ENGINE="$MANABREW_REF:arch-v110-gsz-timeout-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:${HEAP}:rep${REP}"
          set +e
          CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py \
            /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
            /tmp/manabrew/forge/forge-gui/ \
            --mode adversarial --variant "$VARIANT" --fixed-seat "$SEAT" --seeds "$SEED" \
            --max-round 4 --max-prompts 7000 --max-seconds 320 --jvm-reuse 1 \
            --xmx "$HEAP" --xms 192m --cache-dir "$CACHE" --retain-traces all \
            --engine-id "$ENGINE" --output "$ATT" \
            > "out/${VARIANT}-${HEAP}-rep${REP}.log" 2>&1
          RC=$?
          set -e
          python3 - "$ATT" "$RC" <<'PY'
          import json,sys,os
          p,rc=sys.argv[1],int(sys.argv[2])
          try:
              d=json.load(open(p)); r=d[0] if isinstance(d,list) else d
          except Exception as e:
              r={'status':'missing','parseError':repr(e)}
          print(json.dumps({
              'rc':rc,
              'status':r.get('status'),
              'variant':r.get('variant'),
              'seed':r.get('seed'),
              'seat':r.get('kinnanSeat'),
              'pod':r.get('podProfile'),
              'pilotVersion':r.get('pilotVersion'),
              'prompts':r.get('prompts'),
              'wallMs':r.get('wallMs'),
              'assembly':r.get('firstAssemblyTurn'),
              'attempt':r.get('firstAttemptTurn'),
              'protected':r.get('strictProtectedT4'),
              'won':r.get('kinnanWon'),
              'failure':r.get('primaryFailureCode'),
              'cleanup':r.get('v2SessionCleanup'),
              'cleanupError':r.get('v2SessionCleanupError'),
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v110-gsz-timeout-forensic-${{ matrix.heap }}-rep${{ matrix.repetition }}
          path: out/**
          if-no-files-found: error
          retention-days: 7
