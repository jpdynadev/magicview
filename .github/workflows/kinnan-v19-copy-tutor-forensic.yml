name: Kinnan v19 Copy Tutor timeout forensic

on:
  push:
    branches: [agent/kinnan-expanded-architecture]
    paths: [.runs/kinnan-v19-copy-tutor-forensic.txt]
  workflow_dispatch:

concurrency:
  group: kinnan-v19-forensic
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANABREW_REF: 8a1380e5a59986ea3fed143b85f710f9ee3888dc
  SIM_V2_EARLY_SUCCESS: '0'
  SIM_V2_EXACT_DEADLINE: '0'
  SIM_V2_TRACE: '1'
  SIM_V2_CAPTURE_STDERR: '1'
  SIM_V2_PROFILE: arch-repaired-v19-copy-tutor-forensic

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 2800160
            seat: 0
            pod: balanced
          - seed: 2820348
            seat: 2
            pod: balanced
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build exact repaired runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y maven
          python3 engine-tests/generate_architecture_decks_v2.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine-tests/decks/Kinnan_ARCH_F10_COPY_TUTOR.dck')
          lines=p.read_text().splitlines(); start=lines.index('[Main]')+1
          cards=[x.split(' ',1)[1] for x in lines[start:] if x.strip()]
          assert len(cards)==99 and len(set(cards))==99
          assert 'arch-aware-v1.9-adversarial' in Path('engine-tests/manabrew_pilot_arch_adv.py').read_text()
          PY
          rm -rf /tmp/manabrew
          git init /tmp/manabrew
          cd /tmp/manabrew
          git remote add origin https://github.com/witchesofthehill/manabrew.git
          git fetch --depth 1 origin "$MANABREW_REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 engine-tests/apply_manabrew_repairs.py /tmp/manabrew
          cd /tmp/manabrew
          node scripts/harness.mjs build
      - name: Replay pathological key twice with trace
        env:
          SEED: ${{ matrix.seed }}
          SEAT: ${{ matrix.seat }}
          POD: ${{ matrix.pod }}
        run: |
          set -euo pipefail
          mkdir -p out
          for TRY in 1 2; do
            CACHE=".sim-cache/copytutor-forensic-${GITHUB_RUN_ID}-s${SEAT}-${SEED}-${POD}-try${TRY}"
            ENGINE="$MANABREW_REF:arch-v19-copytutor-forensic:${GITHUB_RUN_ID}:${GITHUB_SHA}:s${SEAT}:${SEED}:try${TRY}"
            set +e
            CEDH_POD="$POD" python3 engine-tests/sim_v2_worker_arch.py \
              /tmp/manabrew/forge-harness/target/forge-harness-jar-with-dependencies.jar \
              /tmp/manabrew/forge/forge-gui/ \
              --mode adversarial --variant F10_COPY_TUTOR --fixed-seat "$SEAT" --seeds "$SEED" \
              --max-round 4 --max-prompts 7000 --max-seconds 320 --jvm-reuse 1 \
              --xmx 1280m --xms 192m --cache-dir "$CACHE" --retain-traces all \
              --engine-id "$ENGINE" \
              --exposure-card 'Reshape' --exposure-card 'Spellseeker' \
              --exposure-card 'Energy Refractor' --exposure-card 'Hydroelectric Specimen' \
              --exposure-card 'Clever Impersonator' --exposure-card 'Flesh Duplicate' \
              --exposure-card "Green Sun's Zenith" --exposure-card 'Eldritch Evolution' \
              --output "out/seed${SEED}-seat${SEAT}-${POD}-try${TRY}.json" \
              > "out/seed${SEED}-seat${SEAT}-${POD}-try${TRY}.log" 2>&1
            RC=$?
            set -e
            printf '%s\n' "$RC" > "out/seed${SEED}-seat${SEAT}-${POD}-try${TRY}.rc"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-tutor-forensic-${{ matrix.seed }}-seat${{ matrix.seat }}
          path: out/**
          if-no-files-found: error
          retention-days: 14
