[build]
  command = "bash engine-tests/netlify-forge.sh; npm install --no-save --package-lock=false --ignore-scripts pg@8; node engine-tests/write-forge-result.mjs; npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3000
  autoLaunch = false

